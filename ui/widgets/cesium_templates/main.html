<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>AeroPlan Studio — 3D View</title>
<script src="__CESIUM_JS__"></script>
<link href="__CESIUM_CSS__" rel="stylesheet">
<style>
  html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#0d1117;font-family:sans-serif}
  #cesiumContainer{position:absolute;top:0;left:0;width:100%;height:100%}

  /* 右上工具列 */
  #toolbar{
    position:absolute;top:8px;right:8px;z-index:999;
    display:flex;flex-direction:column;gap:4px;
  }
  #toolbar button{
    background:rgba(30,40,55,0.88);color:#e0e6f0;border:1px solid #3a4a60;
    border-radius:6px;padding:5px 10px;cursor:pointer;font-size:11px;
    transition:background 0.15s;
  }
  #toolbar button:hover{background:rgba(30,90,180,0.85);}

  /* UAV 狀態列（SITL 用） */
  #sitlStatus{
    position:absolute;bottom:36px;left:8px;z-index:999;
    background:rgba(10,15,25,0.82);color:#4fc3f7;
    padding:5px 12px;border-radius:6px;font-size:11px;
    font-family:monospace;display:none;border:1px solid #1565C0;
  }

  /* 碰撞預警面板 */
  #collisionAlert{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1000;
    padding:10px 24px;border-radius:8px;font-size:14px;font-weight:bold;
    font-family:sans-serif;display:none;text-align:center;
    pointer-events:none;animation:alertPulse 0.8s infinite;
  }
  #collisionAlert.warn{
    background:rgba(255,193,7,0.88);color:#000;border:2px solid #FFC107;
  }
  #collisionAlert.danger{
    background:rgba(244,67,54,0.92);color:#FFF;border:2px solid #F44336;
  }
  @keyframes alertPulse{
    0%,100%{opacity:1} 50%{opacity:0.6}
  }

  /* 模式標籤 */
  #modeLabel{
    position:absolute;top:8px;left:8px;z-index:999;
    background:rgba(10,15,25,0.72);color:#80cbc4;
    padding:3px 10px;border-radius:5px;font-size:10px;pointer-events:none;
  }

  /* 左下圖例 */
  #legend{
    position:absolute;bottom:36px;right:8px;z-index:999;
    background:rgba(10,15,25,0.82);color:#cfd8dc;
    padding:6px 12px;border-radius:6px;font-size:10px;
    border:1px solid #37474f;display:none;max-width:160px;
  }
  #legend .item{display:flex;align-items:center;gap:6px;margin:2px 0}
  #legend .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

  /* 圖層過濾器面板 */
  #layerPanel{
    position:absolute;top:8px;left:8px;z-index:999;
    background:rgba(10,15,25,0.88);color:#cfd8dc;
    padding:8px 12px;border-radius:8px;font-size:11px;
    border:1px solid #3a4a60;min-width:130px;
    user-select:none;
  }
  #layerPanel .lp-title{
    font-size:12px;font-weight:bold;color:#90caf9;
    margin-bottom:6px;border-bottom:1px solid #37474f;padding-bottom:4px;
  }
  #layerPanel label{
    display:flex;align-items:center;gap:6px;
    padding:3px 0;cursor:pointer;transition:color 0.15s;
  }
  #layerPanel label:hover{color:#fff}
  #layerPanel input[type="checkbox"]{
    accent-color:#42a5f5;width:14px;height:14px;cursor:pointer;
  }
</style>
</head>
<body>
<div id="cesiumContainer"></div>

<div id="layerPanel">
  <div class="lp-title">📋 圖層過濾</div>
  <label><input type="checkbox" id="lyr_aircraft" checked onchange="toggleLayer('aircraft')">✈ 飛機</label>
  <label><input type="checkbox" id="lyr_trail" checked onchange="toggleLayer('trail')">〰 軌跡</label>
  <label><input type="checkbox" id="lyr_path" checked onchange="toggleLayer('path')">📍 路徑</label>
  <label><input type="checkbox" id="lyr_waypoint" onchange="toggleLayer('waypoint')">🔢 航點標記</label>
  <label><input type="checkbox" id="lyr_imagery" checked onchange="toggleLayer('imagery')">🗺️ 地圖</label>
  <label><input type="checkbox" id="lyr_dem" checked onchange="toggleLayer('dem')">🏔️ DEM</label>
</div>

<div id="toolbar">
  <button onclick="flyToScene()">🎯 飛向路徑</button>
  <button onclick="toggleClamp()">🏔️ 地形吸附</button>
  <button onclick="setMode3D()">🌐 3D</button>
  <button onclick="setMode2D()">🗺️ 2D</button>
  <button onclick="setModeColumbus()">📐 哥倫布</button>
  <button onclick="clearUAV()">✖ 清除 UAV</button>
</div>

<div id="sitlStatus"></div>
<div id="collisionAlert"></div>
<div id="legend" id="legend"></div>

<script>
// ── Cesium Ion Token（使用者可設定，空字串 = 免費基本模式）────────────
Cesium.Ion.defaultAccessToken = '__CESIUM_TOKEN__';

// ── 初始化 Viewer ─────────────────────────────────────────────────────
const viewer = new Cesium.Viewer('cesiumContainer', {
  terrainProvider: new Cesium.EllipsoidTerrainProvider(),  // 無 Token 用平面地形
  baseLayerPicker: false,
  navigationHelpButton: false,
  homeButton: false,
  sceneModePicker: false,
  geocoder: false,
  timeline: true,      // SITL: 時間軸（預留）
  animation: true,     // SITL: 動畫控制（預留）
  fullscreenButton: false,
  infoBox: true,
  selectionIndicator: false,
  shadows: false,
  skyBox: false,
  skyAtmosphere: new Cesium.SkyAtmosphere(),
  requestRenderMode: false,
});

// 深色背景
viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#0d1117');

// 加入 Google 衛星影像（與 2D 地圖一致）
try {
  viewer.imageryLayers.removeAll();
  viewer.imageryLayers.addImageryProvider(
    new Cesium.UrlTemplateImageryProvider({
      url: 'https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
      subdomains: ['0','1','2','3'],
      credit: 'Google Satellite',
      maximumLevel: 22,
    })
  );
} catch(e) {
  console.warn('Google 衛星影像載入失敗，使用預設底圖', e);
}

// 抑制 imagery tile 失敗的紅色錯誤訊息（避免 console 洗版）
viewer.scene.globe.tileLoadProgressEvent.addEventListener(function(){});
if (viewer._cesiumWidget && viewer._cesiumWidget._showRenderLoopErrors !== undefined) {
  viewer._cesiumWidget._showRenderLoopErrors = false;
}
// 攔截 imageryLayer 錯誤事件，只 warn 不丟例外
viewer.imageryLayers.layerAdded.addEventListener(function(layer){
  if (layer.imageryProvider && layer.imageryProvider.errorEvent) {
    layer.imageryProvider.errorEvent.addEventListener(function(err){
      // 只在 console 顯示一次，不再持續刷錯誤
      if (!window._tileWarned) {
        console.warn('部分圖磚載入失敗（網路或伺服器問題），已自動略過');
        window._tileWarned = true;
      }
    });
  }
});

// 嘗試載入世界地形（需要 Cesium Ion Token）
if (Cesium.Ion.defaultAccessToken && Cesium.Ion.defaultAccessToken !== '__CESIUM_TOKEN__') {
  try {
    viewer.terrainProvider = Cesium.createWorldTerrain({ requestWaterMask: false });
  } catch(e) {
    console.warn('地形載入失敗，使用平面模式');
  }
}

// ── 狀態變數 ─────────────────────────────────────────────────────────
let pathEntities   = [];   // 飛行路徑
let markerEntities = [];   // 起終點 / 航點標記
let cornerEntities = [];   // 邊界角點
let polygonEntity  = null; // 邊界多邊形
let circleEntity   = null; // 圓心掃描範圍
let homeEntity     = null; // 起飛點
let uavEntity      = null; // 單機 UAV 即時位置（保留舊 API 相容）
let uavEntities    = {};   // 多機 UAV 字典：{ sysid: entity }
let nfzEntities    = [];   // 禁航區
let clampToGround  = false;
let legendItems    = [];   // 圖例資料
let wpLabelEntities = [];  // 航點標記 (WP1, WP2, ...)

// ── 圖層可見度控制 ───────────────────────────────────────────────
function toggleLayer(layer) {
  const checked = document.getElementById('lyr_' + layer).checked;
  switch(layer) {
    case 'aircraft':
      Object.values(uavEntities).forEach(e => {
        e.show = checked;
        if (e._wingChild) e._wingChild.show = checked;
      });
      break;
    case 'trail':
      Object.values(uavTrails).forEach(e => { e.show = checked; });
      break;
    case 'path':
      pathEntities.forEach(e => { e.show = checked; });
      markerEntities.forEach(e => { e.show = checked; });
      break;
    case 'waypoint':
      wpLabelEntities.forEach(e => { e.show = checked; });
      break;
    case 'imagery':
      for (var i = 0; i < viewer.imageryLayers.length; i++) {
        viewer.imageryLayers.get(i).show = checked;
      }
      break;
    case 'dem':
      if (demOverlayEntity) demOverlayEntity.show = checked;
      if (demOutlineEntity) demOutlineEntity.show = checked;
      demLabelEntities.forEach(e => { e.show = checked; });
      if (demTerrainPrimitive) demTerrainPrimitive.show = checked;
      break;
  }
}

// ── 工具函數 ─────────────────────────────────────────────────────────
function hexColor(hex, alpha) {
  return Cesium.Color.fromCssColorString(hex).withAlpha(alpha !== undefined ? alpha : 0.92);
}

function toPts(arr) {
  // arr: [{lat, lon, alt}, ...]
  return arr.map(p => Cesium.Cartesian3.fromDegrees(p.lon, p.lat, p.alt || 0));
}

function midPoint(pts) {
  if (!pts.length) return null;
  return pts[Math.floor(pts.length / 2)];
}

// ── 路徑操作 ─────────────────────────────────────────────────────────
function clearPaths() {
  pathEntities.forEach(e => { try { viewer.entities.remove(e); } catch(_) {} });
  pathEntities = [];
  markerEntities.forEach(e => { try { viewer.entities.remove(e); } catch(_) {} });
  markerEntities = [];
  wpLabelEntities.forEach(e => { try { viewer.entities.remove(e); } catch(_) {} });
  wpLabelEntities = [];
  document.getElementById('legend').style.display = 'none';
  legendItems = [];
}

/**
 * 加入一條 3D 折線
 * @param {string} ptsJson  JSON 陣列：[{lat,lon,alt}, ...]
 * @param {string} colorHex 十六進位顏色
 * @param {number} width    線寬
 * @param {string} label    路徑標籤（用於圖例、起終點 tooltip）
 * @param {boolean} dashed  是否虛線
 */
function addPath(ptsJson, colorHex, width, label, dashed, forceClamp) {
  const pts = JSON.parse(ptsJson);
  if (pts.length < 2) return;
  const positions = toPts(pts);
  // forceClamp 三態：
  //   true        → 強制貼地（舊版基本演算法）
  //   "off"/false → 強制不貼地（地形跟隨模式：航點 alt 已含 DEM+AGL）
  //   undefined   → 跟隨全域 clampToGround 設定
  let useClamp;
  if (forceClamp === true)              useClamp = true;
  else if (forceClamp === false ||
           forceClamp === 'off')        useClamp = false;
  else                                  useClamp = clampToGround;
  const color = hexColor(colorHex);

  let material;
  if (dashed) {
    material = new Cesium.PolylineDashMaterialProperty({
      color: color,
      dashLength: 16.0,
    });
  } else {
    material = new Cesium.PolylineGlowMaterialProperty({
      glowPower: 0.08,
      color: color,
    });
  }

  const e = viewer.entities.add({
    name: label || 'path',
    polyline: {
      positions: positions,
      width: width || 10,
      material: material,
      clampToGround: useClamp,
      arcType: useClamp ? Cesium.ArcType.GEODESIC : Cesium.ArcType.NONE,
    }
  });
  pathEntities.push(e);

  // 起點標記
  const startE = viewer.entities.add({
    position: positions[0],
    point: {
      pixelSize: 10,
      color: Cesium.Color.LIMEGREEN,
      outlineColor: Cesium.Color.WHITE,
      outlineWidth: 2,
      heightReference: Cesium.HeightReference.NONE,
    },
    label: label ? {
      text: label + '\n起點',
      font: '11px "Segoe UI",sans-serif',
      style: Cesium.LabelStyle.FILL_AND_OUTLINE,
      outlineWidth: 2,
      outlineColor: Cesium.Color.BLACK,
      fillColor: Cesium.Color.WHITE,
      pixelOffset: new Cesium.Cartesian2(0, -16),
      disableDepthTestDistance: Number.POSITIVE_INFINITY,
      show: false,  // hover 才顯示（避免雜亂）
    } : undefined,
  });
  const endE = viewer.entities.add({
    position: positions[positions.length - 1],
    point: {
      pixelSize: 10,
      color: Cesium.Color.TOMATO,
      outlineColor: Cesium.Color.WHITE,
      outlineWidth: 2,
      heightReference: Cesium.HeightReference.NONE,
    },
  });
  markerEntities.push(startE, endE);

  // 航點標記 (WP0, WP1, WP2, ...)
  const showWp = document.getElementById('lyr_waypoint').checked;
  for (var wi = 0; wi < positions.length; wi++) {
    var wpE = viewer.entities.add({
      position: positions[wi],
      point: {
        pixelSize: 7,
        color: hexColor(colorHex, 0.9),
        outlineColor: Cesium.Color.WHITE,
        outlineWidth: 1.5,
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
      },
      label: {
        text: 'WP' + wi,
        font: 'bold 11px "Segoe UI",sans-serif',
        fillColor: Cesium.Color.WHITE,
        outlineColor: Cesium.Color.BLACK,
        outlineWidth: 2,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        pixelOffset: new Cesium.Cartesian2(0, -14),
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
        scale: 0.9,
      },
      show: showWp,
    });
    wpLabelEntities.push(wpE);
  }

  // 更新圖例
  if (label) {
    legendItems.push({ color: colorHex, label: label });
    _updateLegend();
  }
}

function _updateLegend() {
  const el = document.getElementById('legend');
  if (!legendItems.length) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = '<b style="font-size:11px;color:#90caf9">航線圖例</b>' +
    legendItems.map(item =>
      `<div class="item"><div class="dot" style="background:${item.color}"></div><span>${item.label}</span></div>`
    ).join('');
}

// ── 角點 / 邊界 ──────────────────────────────────────────────────────
function clearCorners() {
  cornerEntities.forEach(e => { try { viewer.entities.remove(e); } catch(_) {} });
  cornerEntities = [];
  if (polygonEntity) { viewer.entities.remove(polygonEntity); polygonEntity = null; }
}

function setCorners(cornersJson) {
  clearCorners();
  const corners = JSON.parse(cornersJson);
  if (!corners.length) return;

  corners.forEach((c, i) => {
    const e = viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(c.lon, c.lat, 0),
      point: {
        pixelSize: 13,
        color: hexColor('#E53935'),
        outlineColor: Cesium.Color.WHITE,
        outlineWidth: 2,
        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
      },
      label: {
        text: String(i + 1),
        font: 'bold 11px sans-serif',
        pixelOffset: new Cesium.Cartesian2(0, -18),
        fillColor: Cesium.Color.WHITE,
        outlineColor: Cesium.Color.BLACK,
        outlineWidth: 2,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
      },
    });
    cornerEntities.push(e);
  });

  if (corners.length >= 3) {
    const degs = corners.flatMap(c => [c.lon, c.lat]);
    polygonEntity = viewer.entities.add({
      polygon: {
        hierarchy: Cesium.Cartesian3.fromDegreesArray(degs),
        material: hexColor('#2196F3', 0.15),
        outline: true,
        outlineColor: hexColor('#2196F3', 0.9),
        classificationType: Cesium.ClassificationType.TERRAIN,
      },
    });
  }
}

// ── 戰術視覺化：四散決斷圈 + 預備點盤旋圓 + 俯衝紅線 ───────────────────
// （Diamond Swarm Strike — Phase 2 dispersion ring / Phase 3 loiter & dive）
let _tacticalEntities = [];
function clearTacticalOverlay() {
  _tacticalEntities.forEach(e => { try { viewer.entities.remove(e); } catch(_){} });
  _tacticalEntities = [];
}
// 四散決斷圈：以目標為圓心畫琥珀色虛線圓 (TABLE XL caution boundary)
function setDispersionRing(lat, lon, radius_m) {
  const e = viewer.entities.add({
    name: 'DispersionRing',
    position: Cesium.Cartesian3.fromDegrees(lon, lat, 0),
    ellipse: {
      semiMajorAxis: radius_m,
      semiMinorAxis: radius_m,
      material: Cesium.Color.fromCssColorString('#FFB703').withAlpha(0.06),
      outline: true,
      outlineColor: Cesium.Color.fromCssColorString('#FFB703').withAlpha(0.95),
      outlineWidth: 3,
      // 虛線效果（Cesium 不支援 ellipse 虛線輪廓 → 改用 2 個 polyline）
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
    },
  });
  _tacticalEntities.push(e);
  // 補充：用 polyline 重疊一條虛線軌跡，模擬 dashed 效果
  const pts = [];
  for (let i = 0; i <= 64; i++) {
    const ang = (i / 64) * 2 * Math.PI;
    const dlat = (radius_m * Math.cos(ang)) / 111320.0;
    const dlon = (radius_m * Math.sin(ang)) / (111320.0 * Math.cos(lat * Math.PI / 180));
    pts.push(lon + dlon, lat + dlat, 0);
  }
  const dashed = viewer.entities.add({
    polyline: {
      positions: Cesium.Cartesian3.fromDegreesArrayHeights(pts),
      width: 3,
      material: new Cesium.PolylineDashMaterialProperty({
        color: Cesium.Color.fromCssColorString('#FFB703'),
        dashLength: 16.0,
      }),
      clampToGround: true,
    },
  });
  _tacticalEntities.push(dashed);
}
// 預備點盤旋圓 (NAV_LOITER_TIME 視覺化)
function addLoiterCircle(lat, lon, radius_m, alt_m, colorHex) {
  const c = colorHex || '#FFB703';
  const e = viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(lon, lat, alt_m || 500),
    ellipse: {
      semiMajorAxis: radius_m,
      semiMinorAxis: radius_m,
      material: Cesium.Color.fromCssColorString(c).withAlpha(0.10),
      outline: true,
      outlineColor: Cesium.Color.fromCssColorString(c).withAlpha(0.85),
      outlineWidth: 2,
      height: alt_m || 500,
    },
  });
  _tacticalEntities.push(e);
}
// 俯衝紅線（從 P_dive 切到目標，血紅）
function addDiveLine(lat0, lon0, alt0, lat_t, lon_t, alt_t) {
  const e = viewer.entities.add({
    polyline: {
      positions: Cesium.Cartesian3.fromDegreesArrayHeights([
        lon0, lat0, alt0,
        lon_t, lat_t, alt_t,
      ]),
      width: 4,
      material: new Cesium.PolylineGlowMaterialProperty({
        glowPower: 0.18,
        color: Cesium.Color.fromCssColorString('#FF003C'),
      }),
      arcType: Cesium.ArcType.NONE,
    },
  });
  _tacticalEntities.push(e);
}

// ── 電子圍籬 (Geofence) — 黃色邊界 = §5.17.25 TABLE XL「caution boundary」─────
// 4 頂點矩形 + altitude band 視覺化（地面外框 + 高度上限頂蓋）
let geofenceEntities = [];
function clearGeofence() {
  geofenceEntities.forEach(e => { try { viewer.entities.remove(e); } catch(_){} });
  geofenceEntities = [];
}
function setGeofence(jsonStr) {
  clearGeofence();
  let g;
  try { g = JSON.parse(jsonStr); } catch(_) { return; }
  if (!g || !g.vertices || g.vertices.length < 3) return;

  const verts = g.vertices;             // [{lat,lon}, ...] 4 點
  const altMin = g.alt_min || 0;
  const altMax = g.alt_max || 100;
  const fenceColor = '#FFB703';         // WARNING 琥珀（caution boundary）

  // 1) 地面投影矩形（半透明填充 + 黃色實線外框）
  const flatDegs = verts.flatMap(v => [v.lon, v.lat]);
  geofenceEntities.push(viewer.entities.add({
    name: 'Geofence-floor',
    polygon: {
      hierarchy: Cesium.Cartesian3.fromDegreesArray(flatDegs),
      material: hexColor(fenceColor, 0.10),
      outline: true,
      outlineColor: hexColor(fenceColor, 0.95),
      outlineWidth: 2,
      classificationType: Cesium.ClassificationType.TERRAIN,
    },
  }));

  // 2) 4 個側牆 (vertical wall) — 從 altMin 到 altMax
  const ring = [...verts, verts[0]];
  for (let i = 0; i < ring.length - 1; i++) {
    const v0 = ring[i], v1 = ring[i+1];
    const wall = Cesium.Cartesian3.fromDegreesArrayHeights([
      v0.lon, v0.lat, altMin,
      v1.lon, v1.lat, altMin,
      v1.lon, v1.lat, altMax,
      v0.lon, v0.lat, altMax,
    ]);
    geofenceEntities.push(viewer.entities.add({
      name: 'Geofence-wall',
      polygon: {
        hierarchy: wall,
        perPositionHeight: true,
        material: hexColor(fenceColor, 0.12),
        outline: true,
        outlineColor: hexColor(fenceColor, 0.7),
      },
    }));
  }

  // 3) 頂蓋 (max altitude ceiling) — 較淡，用虛線概念
  const ceilingDegsHeights = verts.flatMap(v => [v.lon, v.lat, altMax]);
  geofenceEntities.push(viewer.entities.add({
    name: 'Geofence-ceiling',
    polygon: {
      hierarchy: Cesium.Cartesian3.fromDegreesArrayHeights(ceilingDegsHeights),
      perPositionHeight: true,
      material: hexColor(fenceColor, 0.06),
      outline: true,
      outlineColor: hexColor(fenceColor, 0.5),
    },
  }));

  // 4) 角點標籤（顯示 4 個頂點編號 + 海拔範圍註解）
  verts.forEach((v, i) => {
    geofenceEntities.push(viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(v.lon, v.lat, altMax + 5),
      label: {
        text: 'F' + (i+1),
        font: 'bold 11px sans-serif',
        fillColor: hexColor(fenceColor),
        outlineColor: Cesium.Color.BLACK,
        outlineWidth: 2,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        pixelOffset: new Cesium.Cartesian2(0, -10),
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
      },
    }));
  });
  console.log('[3D] Geofence: ' + verts.length + ' 頂點, alt='
              + altMin.toFixed(0) + '~' + altMax.toFixed(0) + 'm');
}

// ══════════════════════════════════════════════════════════════════════
//  Fence Zone Multi-Zone Visualization
//  ---------------------------------------------------------------------
//  把 NFZ / 動態威脅 / 任務作業圍籬統一成「fence-style」3D 立體呈現：
//      floor (地面投影填色) + walls (4+ 側牆) + ceiling (淡色頂蓋) +
//      角點 F1..Fn 標籤
//
//  與既有 setGeofence() 同視覺風格，差別在：
//    - 支援同時多區（fenceZoneEntities[zoneId] → entity 陣列）
//    - 接受 colorHex 參數（依 category 上色）
//    - 接受任意頂點數（圓形由 Python 端展開為 N 邊形再傳入）
//    - 加上 inclusion 標記（exclusion 用斜線視覺）
// ══════════════════════════════════════════════════════════════════════
var fenceZoneEntities = {};   // {zoneId: [entity, ...]}

/**
 * 新增或更新一個 fence zone（同 id 會先 remove 再 add）
 *
 * @param {string} zoneId       唯一 ID
 * @param {Array}  vertices     [{lat, lon}, ...] 至少 3 點
 * @param {number} altMin       海拔下限 (m)
 * @param {number} altMax       海拔上限 (m)
 * @param {string} name         顯示名稱
 * @param {string} colorHex     顏色 (#RRGGBB)
 * @param {string} category     'NFZ' | 'THREAT' | 'GEOFENCE'（顯示用）
 * @param {boolean} inclusion   true=圍住飛機在內、false=禁止進入
 */
function addFenceZone(zoneId, vertices, altMin, altMax, name,
                      colorHex, category, inclusion) {
  if (!zoneId || !vertices || vertices.length < 3) return;
  removeFenceZone(zoneId);

  var color = colorHex || '#E53935';
  var entList = [];
  var aMin = (typeof altMin === 'number') ? altMin : 0;
  var aMax = (typeof altMax === 'number') ? altMax : 200;

  // 1) 地面投影多邊形 — exclusion 用較濃填色（強調禁區），inclusion 較淡
  var floorAlpha = inclusion ? 0.08 : 0.18;
  var flatDegs = vertices.flatMap(function (v) { return [v.lon, v.lat]; });
  entList.push(viewer.entities.add({
    name: 'FenceZone-floor-' + zoneId,
    polygon: {
      hierarchy: Cesium.Cartesian3.fromDegreesArray(flatDegs),
      material: hexColor(color, floorAlpha),
      outline: true,
      outlineColor: hexColor(color, 0.95),
      outlineWidth: 2,
      classificationType: Cesium.ClassificationType.TERRAIN,
    },
  }));

  // 2) 側牆（N 面） — 從 altMin 到 altMax
  var ring = vertices.slice();
  ring.push(vertices[0]);
  for (var i = 0; i < ring.length - 1; i++) {
    var v0 = ring[i], v1 = ring[i + 1];
    var wall = Cesium.Cartesian3.fromDegreesArrayHeights([
      v0.lon, v0.lat, aMin,
      v1.lon, v1.lat, aMin,
      v1.lon, v1.lat, aMax,
      v0.lon, v0.lat, aMax,
    ]);
    entList.push(viewer.entities.add({
      name: 'FenceZone-wall-' + zoneId + '-' + i,
      polygon: {
        hierarchy: wall,
        perPositionHeight: true,
        material: hexColor(color, 0.14),
        outline: true,
        outlineColor: hexColor(color, 0.7),
      },
    }));
  }

  // 3) 頂蓋（較淡）
  var ceilingDegsHeights = vertices.flatMap(function (v) {
    return [v.lon, v.lat, aMax];
  });
  entList.push(viewer.entities.add({
    name: 'FenceZone-ceiling-' + zoneId,
    polygon: {
      hierarchy: Cesium.Cartesian3.fromDegreesArrayHeights(ceilingDegsHeights),
      perPositionHeight: true,
      material: hexColor(color, 0.06),
      outline: true,
      outlineColor: hexColor(color, 0.5),
    },
  }));

  // 4) 角點標籤（F1..Fn，限制至多 8 個避免太擠；超過則只標前 8）
  var labelCount = Math.min(vertices.length, 8);
  for (var j = 0; j < labelCount; j++) {
    var v = vertices[j];
    entList.push(viewer.entities.add({
      name: 'FenceZone-label-' + zoneId + '-' + j,
      position: Cesium.Cartesian3.fromDegrees(v.lon, v.lat, aMax + 5),
      label: {
        text: 'F' + (j + 1),
        font: 'bold 10px sans-serif',
        fillColor: hexColor(color),
        outlineColor: Cesium.Color.BLACK,
        outlineWidth: 2,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        pixelOffset: new Cesium.Cartesian2(0, -8),
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
      },
    }));
  }

  // 5) 中心標籤（顯示 category + name + alt 範圍）
  var cx = 0, cy = 0;
  vertices.forEach(function (v) { cx += v.lon; cy += v.lat; });
  cx /= vertices.length; cy /= vertices.length;
  var catTag = (category || 'ZONE').toUpperCase();
  var incTag = inclusion ? 'IN' : 'OUT';
  entList.push(viewer.entities.add({
    name: 'FenceZone-title-' + zoneId,
    position: Cesium.Cartesian3.fromDegrees(cx, cy, aMax + 30),
    label: {
      text: '[' + catTag + ' / ' + incTag + ']  ' + (name || zoneId)
            + '\nalt ' + aMin.toFixed(0) + '–' + aMax.toFixed(0) + ' m',
      font: 'bold 11px monospace',
      fillColor: Cesium.Color.WHITE,
      outlineColor: Cesium.Color.BLACK,
      outlineWidth: 2,
      style: Cesium.LabelStyle.FILL_AND_OUTLINE,
      backgroundColor: hexColor(color, 0.65),
      showBackground: true,
      backgroundPadding: new Cesium.Cartesian2(6, 4),
      pixelOffset: new Cesium.Cartesian2(0, -6),
      horizontalOrigin: Cesium.HorizontalOrigin.CENTER,
      verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
      disableDepthTestDistance: Number.POSITIVE_INFINITY,
    },
  }));

  fenceZoneEntities[zoneId] = entList;
  console.log('[FenceZone] add ' + zoneId + ' (' + catTag + ', n='
              + vertices.length + ', alt=' + aMin.toFixed(0) + '~'
              + aMax.toFixed(0) + 'm, inclusion=' + inclusion + ')');
}

/**
 * 移除指定 fence zone
 */
function removeFenceZone(zoneId) {
  var arr = fenceZoneEntities[zoneId];
  if (!arr) return;
  arr.forEach(function (e) {
    try { viewer.entities.remove(e); } catch (_) {}
  });
  delete fenceZoneEntities[zoneId];
}

/**
 * 清除全部 fence zones
 */
function clearAllFenceZones() {
  Object.keys(fenceZoneEntities).forEach(function (zid) {
    fenceZoneEntities[zid].forEach(function (e) {
      try { viewer.entities.remove(e); } catch (_) {}
    });
  });
  fenceZoneEntities = {};
}

// ── SITL 即時 UAV 位置更新（多機支援）────────────────────────────────
// 呼叫方式：updateUAVPosition(lat, lon, alt, hdg, spd, sysid, mode, armed)
const _UAV_COLORS = ['#FFD700','#E53935','#43A047','#1E88E5','#8E24AA','#00ACC1','#FB8C00','#3949AB'];
const _PLANE_MODEL_URI = '__PLANE_MODEL_URI__';
const _COPTER_MODEL_URI = '__COPTER_MODEL_URI__';

// GLB 模型方向校正（單位：度）。MAVLink heading: 0=北, 90=東 (順時針)。
// Cesium HPR heading 軸繞 -Z，若模型預設 forward 為 +X(東)，需 -90° 將其轉向北。
// 若視覺仍偏離 HUD 儀表板，調整這兩個值即可。
const _PLANE_HEADING_OFFSET  = -90;   // 固定翼 GLB forward = +X (Cesium 慣例)
const _PLANE_PITCH_OFFSET    = 90;   // 固定翼 GLB pitch +90° 校正
const _PLANE_ROLL_OFFSET     = 180;   // GLB 機身上下倒置校正 (roll 翻正)
const _COPTER_HEADING_OFFSET = -90;   // 多旋翼 GLB yaw 逆時針 90°
const _COPTER_PITCH_OFFSET   = 90;   // 多旋翼 GLB pitch +90° 校正
const _COPTER_ROLL_OFFSET    = 180;   // GLB 機身上下倒置校正 (roll 翻正)

// 各機即時姿態緩存（由 updateUAVPosition 填入），供跟隨相機/FOV 等使用
const _UAV_STATE = {};

// ── 跟隨相機（Chase Camera / Flight-Sim View）────────────────────────
let _chaseSysid = 0;           // 0 = 關閉
let _chasePreRender = null;
const _chaseConfig = {
  distance: 80.0,   // 相機位於飛機後方公尺
  height:   20.0,   // 高於飛機公尺
  pitchDeg: -10.0,  // 相機俯角
  smoothing: 0.18,  // 0 = 無延遲，1 = 永不到位；建議 0.1 ~ 0.3
};
let _chaseFrameInit = false;   // 首幀才套用初始偏移；後續只更新 transform 以保留使用者滑鼠旋轉

function setChaseCamera(sysid) {
  // 解除 FPV 模式（兩種鏡頭互斥）
  _disableFpvCamera();
  // 先解除舊的 listener / 鎖定
  if (_chasePreRender) {
    viewer.scene.preRender.removeEventListener(_chasePreRender);
    _chasePreRender = null;
  }
  try { viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY); } catch(_) {}
  _chaseSysid = sysid | 0;
  _chaseFrameInit = false;
  if (_chaseSysid <= 0) {
    console.log('[3D] 跟隨相機：關閉');
    return;
  }

  _chasePreRender = function() {
    const st = _UAV_STATE[_chaseSysid];
    const entity = uavEntities[_chaseSysid];
    if (!st || !entity) return;
    const targetPos = Cesium.Cartesian3.fromDegrees(st.lon, st.lat, st.alt);
    const hdgRad = Cesium.Math.toRadians(st.heading);

    // Body frame：只套用 heading，讓「後方」始終相對機頭正後方。
    // 忽略飛機 pitch/roll，避免急轉彎時畫面跟著翻轉。
    const bodyFrame = Cesium.Transforms.headingPitchRollToFixedFrame(
      targetPos,
      new Cesium.HeadingPitchRoll(hdgRad, 0, 0)
    );

    // 關鍵：lookAtTransform(T) 不傳 offset 時，Cesium 只更新 reference frame
    // 而保留相機 world 座標 → 相機不會跟著飛機平移！
    // 必須每幀都傳 offset。為了保留滑鼠旋轉/縮放輸入，offset 取自上一幀
    // 結束時相機在 body frame 中的相對位置 (camera.position) — 也就是
    // 使用者滑鼠調整後的「相對機體位置」，再套用到新 body frame，達成
    // 「跟隨 + 自由旋轉」並存。
    let offset;
    if (!_chaseFrameInit) {
      // 首幀：放在後方 -Y + 上方 +Z
      offset = new Cesium.Cartesian3(
        0,
        -_chaseConfig.distance,
        _chaseConfig.height
      );
      _chaseFrameInit = true;
    } else {
      // 後續：把上一幀末的 camera.position（已含使用者滑鼠調整）轉成
      // 新 body frame 的 offset，本質上「保留使用者軌道在 body frame 中
      // 的相對角度與距離」。
      offset = Cesium.Cartesian3.clone(viewer.camera.position);
    }
    viewer.camera.lookAtTransform(bodyFrame, offset);
  };
  viewer.scene.preRender.addEventListener(_chasePreRender);
  console.log('[3D] 跟隨相機：鎖定 UAV' + _chaseSysid + '（可滑鼠拖曳旋轉 / 滾輪縮放）');
}

function setChaseCameraParams(distance, height, pitchDeg, smoothing) {
  if (typeof distance === 'number' && distance > 0) _chaseConfig.distance = distance;
  if (typeof height === 'number') _chaseConfig.height = height;
  if (typeof pitchDeg === 'number') _chaseConfig.pitchDeg = pitchDeg;
  if (typeof smoothing === 'number') _chaseConfig.smoothing = Math.max(0, Math.min(0.95, smoothing));
  _chaseFrameInit = false;  // 下一幀重新套用新距離/高度
}

// 若使用者滑鼠旋轉偏離太多，可呼叫此函式把鏡頭歸零回預設後方視角
function resetChaseView() {
  _chaseFrameInit = false;
}

// ── FPV 第一人稱視角（機上相機 / 雲台偵查鏡頭）──────────────────────
let _fpvSysid = 0;
let _fpvPreRender = null;
let _fpvOriginalFov = null;   // 還原 Cesium 預設 FOV 用
const _fpvConfig = {
  gimbalPitchDeg: 0,    // 0 = 平視前方(FPV), -90 = 正下方 (偵查鏡頭)
  fovDeg:         75,   // 水平視角，典型無人機相機 70~90°，競速 FPV 可到 130°
  rollFollow:    true,  // 是否跟隨機體 roll（沉浸感 vs 雲台穩定）
  forwardOffset: 2.0,   // 鏡頭在機頭前方公尺，避免看到自己模型
  upOffset:      0.3,   // 鏡頭略高於機身中心
};

function _disableFpvCamera() {
  if (_fpvPreRender) {
    viewer.scene.preRender.removeEventListener(_fpvPreRender);
    _fpvPreRender = null;
  }
  if (_fpvOriginalFov !== null && viewer.camera.frustum &&
      'fov' in viewer.camera.frustum) {
    try { viewer.camera.frustum.fov = _fpvOriginalFov; } catch(_) {}
    _fpvOriginalFov = null;
  }
  _fpvSysid = 0;
}

function setFpvCamera(sysid, gimbalPitchDeg, fovDeg, rollFollow) {
  // 兩種模式互斥：先關閉 chase
  if (_chasePreRender) {
    viewer.scene.preRender.removeEventListener(_chasePreRender);
    _chasePreRender = null;
    _chaseSysid = 0;
  }
  _disableFpvCamera();
  try { viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY); } catch(_) {}

  _fpvSysid = sysid | 0;
  if (_fpvSysid <= 0) {
    console.log('[3D] FPV 相機：關閉');
    return;
  }

  // 套用參數（undefined 則沿用現值）
  if (typeof gimbalPitchDeg === 'number') _fpvConfig.gimbalPitchDeg = gimbalPitchDeg;
  if (typeof fovDeg === 'number' && fovDeg > 10 && fovDeg < 170) _fpvConfig.fovDeg = fovDeg;
  if (typeof rollFollow === 'boolean') _fpvConfig.rollFollow = rollFollow;

  // 設定相機 FOV（記住原值以便關閉時還原）
  if (viewer.camera.frustum && 'fov' in viewer.camera.frustum) {
    _fpvOriginalFov = viewer.camera.frustum.fov;
    viewer.camera.frustum.fov = Cesium.Math.toRadians(_fpvConfig.fovDeg);
  }

  _fpvPreRender = function() {
    const st = _UAV_STATE[_fpvSysid];
    const entity = uavEntities[_fpvSysid];
    if (!st || !entity) return;
    const targetPos = Cesium.Cartesian3.fromDegrees(st.lon, st.lat, st.alt);
    const hdgRad    = Cesium.Math.toRadians(st.heading);
    const acPitch   = Cesium.Math.toRadians(st.pitch || 0);
    const acRoll    = Cesium.Math.toRadians(st.roll  || 0);

    // 機頭前方偏移（ENU: +X=East, +Y=North, +Z=Up）
    const fwd = _fpvConfig.forwardOffset;
    const noseENU = new Cesium.Cartesian3(
      Math.sin(hdgRad) * fwd,
      Math.cos(hdgRad) * fwd,
      _fpvConfig.upOffset
    );
    const enuMtx = Cesium.Transforms.eastNorthUpToFixedFrame(targetPos);
    const worldOffset = Cesium.Matrix4.multiplyByPointAsVector(
      enuMtx, noseENU, new Cesium.Cartesian3()
    );
    const camPos = Cesium.Cartesian3.add(targetPos, worldOffset, new Cesium.Cartesian3());

    // 雲台俯角 + 機體姿態（若跟隨 roll）
    const finalPitch = Cesium.Math.toRadians(_fpvConfig.gimbalPitchDeg)
                     + (_fpvConfig.rollFollow ? acPitch : 0);
    const finalRoll  = _fpvConfig.rollFollow ? acRoll : 0;

    viewer.camera.setView({
      destination: camPos,
      orientation: {
        heading: hdgRad,
        pitch:   finalPitch,
        roll:    finalRoll,
      }
    });
  };
  viewer.scene.preRender.addEventListener(_fpvPreRender);
  console.log('[3D] FPV 相機：UAV' + _fpvSysid +
              ' gimbal=' + _fpvConfig.gimbalPitchDeg +
              '° FOV=' + _fpvConfig.fovDeg + '°');
}

function setFpvCameraParams(gimbalPitchDeg, fovDeg, rollFollow, forwardOffset) {
  if (typeof gimbalPitchDeg === 'number') _fpvConfig.gimbalPitchDeg = gimbalPitchDeg;
  if (typeof fovDeg === 'number' && fovDeg > 10 && fovDeg < 170) {
    _fpvConfig.fovDeg = fovDeg;
    // 即時套用 FOV
    if (_fpvSysid > 0 && viewer.camera.frustum && 'fov' in viewer.camera.frustum) {
      viewer.camera.frustum.fov = Cesium.Math.toRadians(fovDeg);
    }
  }
  if (typeof rollFollow === 'boolean') _fpvConfig.rollFollow = rollFollow;
  if (typeof forwardOffset === 'number') _fpvConfig.forwardOffset = forwardOffset;
}

// 多旋翼 SVG（X 型四軸 + 中央機身）
function _uavSvgCopter(colorHex) {
  return 'data:image/svg+xml,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">' +
    '<line x1="8" y1="8" x2="40" y2="40" stroke="#222" stroke-width="3"/>' +
    '<line x1="40" y1="8" x2="8" y2="40" stroke="#222" stroke-width="3"/>' +
    '<circle cx="8" cy="8" r="6" fill="' + colorHex + '" stroke="#222" stroke-width="1.5"/>' +
    '<circle cx="40" cy="8" r="6" fill="' + colorHex + '" stroke="#222" stroke-width="1.5"/>' +
    '<circle cx="8" cy="40" r="6" fill="' + colorHex + '" stroke="#222" stroke-width="1.5"/>' +
    '<circle cx="40" cy="40" r="6" fill="' + colorHex + '" stroke="#222" stroke-width="1.5"/>' +
    '<rect x="18" y="18" width="12" height="12" rx="2" fill="#FFF" stroke="#222" stroke-width="1.5"/>' +
    '<polygon points="24,12 28,20 20,20" fill="#E53935"/>' +  // 朝前指示三角
    '</svg>'
  );
}

// 固定翼 SVG（飛機俯視圖）
function _uavSvgPlane(colorHex) {
  return 'data:image/svg+xml,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">' +
    '<polygon points="24,2 28,22 46,28 46,32 28,30 28,40 34,44 34,46 24,44 14,46 14,44 20,40 20,30 2,32 2,28 20,22" ' +
    'fill="' + colorHex + '" stroke="#1a1a1a" stroke-width="1.5" stroke-linejoin="round"/>' +
    '<circle cx="24" cy="14" r="2" fill="#FFF"/>' +
    '</svg>'
  );
}

function _uavSvg(colorHex, vtype) {
  const vt = (vtype || '').toUpperCase();
  if (vt.indexOf('PLANE') >= 0 || vt.indexOf('FIXED') >= 0 || vt.indexOf('VTOL') >= 0) {
    return _uavSvgPlane(colorHex);
  }
  return _uavSvgCopter(colorHex);
}

if (typeof uavTrails === 'undefined') { var uavTrails = {}; var uavTrailPts = {}; }
function _appendTrail(sysid, lat, lon, alt, colorHex) {
  if (!uavTrailPts[sysid]) uavTrailPts[sysid] = [];
  const arr = uavTrailPts[sysid];
  arr.push(lon, lat, alt || 0);
  // 限制最多 1500 點 (= 500 個 3D 點)
  if (arr.length > 1500 * 3) arr.splice(0, 3);
  if (arr.length < 6) return;

  // ★ 修復閃爍：原本每次 update_uav_position (5-10Hz) 都 remove+add entity，
  // 造成軌跡先消失再重畫 → 視覺上「一閃一閃」。
  // 改用 CallbackProperty：positions 從共享 arr 變數動態拉取，entity 只建一次，
  // 之後僅 push 點到 arr，Cesium 每幀自動拿到最新陣列繪製，零閃爍。
  if (!uavTrails[sysid]) {
    uavTrails[sysid] = viewer.entities.add({
      name: 'UAV-trail-' + sysid,
      polyline: {
        positions: new Cesium.CallbackProperty(function () {
          return Cesium.Cartesian3.fromDegreesArrayHeights(arr);
        }, false),    // false = 非 time-varying，每幀直接呼叫
        width: 4,
        material: new Cesium.PolylineGlowMaterialProperty({
          glowPower: 0.15,
          color: Cesium.Color.fromCssColorString(colorHex).withAlpha(0.9),
        }),
        arcType: Cesium.ArcType.NONE,
      }
    });
  }
  // 後續呼叫不再動 entity；CallbackProperty 會自動讀取 arr 最新值
}

// ── 碰撞預警系統 ────────────────────────────────────────────────
const COLLISION_WARN_DIST = 80;   // 預警距離 (m) — 黃色
const COLLISION_DANGER_DIST = 30; // 危險距離 (m) — 紅色
let collisionWarnings = {};       // {key: entity} 預警連線
let _lastCollisionAudio = 0;

function _uavDistance(pos1, pos2) {
  return Cesium.Cartesian3.distance(pos1, pos2);
}

function _checkCollisions() {
  // ★ 修復閃爍：原本每次 update_uav_position 都 remove + add 所有 collision
  // 警告線（pair 數 = N×(N-1)/2，N=4 時 6 條）→ 高頻 mavlink 更新下嚴重閃爍。
  // 改為「保留 entity，只更新 positions/text，不再 remove+add」。
  // pair 不在警告距離內時則 hide（show=false）但保留 entity 以便重新顯示。
  const ids = Object.keys(uavEntities);
  if (ids.length < 2) {
    // 飛機數 < 2，把所有警告線隱藏
    Object.values(collisionWarnings).forEach(e => { e.show = false; });
    document.getElementById('collisionAlert').style.display = 'none';
    return;
  }

  let worstLevel = 0; // 0=safe, 1=warn, 2=danger
  let worstDist = Infinity;
  let worstPair = '';

  // 標記哪些 pair 在這一幀有效；其他 pair 設 show=false
  const activeKeys = new Set();

  for (let i = 0; i < ids.length; i++) {
    for (let j = i + 1; j < ids.length; j++) {
      const eA = uavEntities[ids[i]], eB = uavEntities[ids[j]];
      if (!eA || !eB || !eA.position || !eB.position) continue;
      const pA = eA.position.getValue(Cesium.JulianDate.now());
      const pB = eB.position.getValue(Cesium.JulianDate.now());
      if (!pA || !pB) continue;
      const dist = _uavDistance(pA, pB);

      if (dist < COLLISION_WARN_DIST) {
        const isDanger = dist < COLLISION_DANGER_DIST;
        const level = isDanger ? 2 : 1;
        if (level > worstLevel || (level === worstLevel && dist < worstDist)) {
          worstLevel = level;
          worstDist = dist;
          worstPair = 'UAV' + ids[i] + '↔UAV' + ids[j];
        }

        const key = ids[i] + '-' + ids[j];
        activeKeys.add(key);
        const lineColor = isDanger
          ? Cesium.Color.RED.withAlpha(0.9)
          : Cesium.Color.YELLOW.withAlpha(0.7);
        const midPos = Cesium.Cartesian3.midpoint(pA, pB, new Cesium.Cartesian3());

        // 軟狀態 — 用 closure 抓 pA/pB 的快取，每幀刷新
        let entry = collisionWarnings[key];
        if (!entry) {
          // 第一次建立 — positions 用 CallbackProperty 動態取兩端 UAV 位置
          // 這樣後續位置變動時 entity 不需重建，僅 Cesium 內部刷新
          const idA = ids[i], idB = ids[j];
          const posCb = new Cesium.CallbackProperty(function () {
            const a = uavEntities[idA], b = uavEntities[idB];
            if (!a || !b || !a.position || !b.position) return [];
            const _pa = a.position.getValue(Cesium.JulianDate.now());
            const _pb = b.position.getValue(Cesium.JulianDate.now());
            if (!_pa || !_pb) return [];
            return [_pa, _pb];
          }, false);
          const midCb = new Cesium.CallbackProperty(function () {
            const a = uavEntities[idA], b = uavEntities[idB];
            if (!a || !b || !a.position || !b.position) return midPos;
            const _pa = a.position.getValue(Cesium.JulianDate.now());
            const _pb = b.position.getValue(Cesium.JulianDate.now());
            if (!_pa || !_pb) return midPos;
            return Cesium.Cartesian3.midpoint(_pa, _pb, new Cesium.Cartesian3());
          }, false);
          entry = viewer.entities.add({
            position: midCb,
            polyline: {
              positions: posCb,
              width: isDanger ? 5 : 3,
              material: new Cesium.PolylineDashMaterialProperty({
                color: lineColor,
                dashLength: isDanger ? 8 : 14,
              }),
              arcType: Cesium.ArcType.NONE,
            },
            label: {
              text: '⚠ ' + dist.toFixed(1) + 'm',
              font: 'bold 13px sans-serif',
              fillColor: isDanger ? Cesium.Color.RED : Cesium.Color.YELLOW,
              outlineColor: Cesium.Color.BLACK,
              outlineWidth: 3,
              style: Cesium.LabelStyle.FILL_AND_OUTLINE,
              disableDepthTestDistance: Number.POSITIVE_INFINITY,
              showBackground: true,
              backgroundColor: new Cesium.Color(0, 0, 0, 0.7),
            },
          });
          collisionWarnings[key] = entry;
        }
        // 後續每幀僅更新 label 文字（距離數值）+ 顏色 + 確保 show=true
        entry.show = true;
        if (entry.label) {
          entry.label.text = '⚠ ' + dist.toFixed(1) + 'm';
          entry.label.fillColor = isDanger ? Cesium.Color.RED : Cesium.Color.YELLOW;
        }
        if (entry.polyline) {
          entry.polyline.material = new Cesium.PolylineDashMaterialProperty({
            color: lineColor,
            dashLength: isDanger ? 8 : 14,
          });
          entry.polyline.width = isDanger ? 5 : 3;
        }
      }
    }
  }
  // 把這幀沒進入警告距離的 pair 設 show=false（不刪除 entity 避免閃爍）
  Object.keys(collisionWarnings).forEach(function (k) {
    if (!activeKeys.has(k)) collisionWarnings[k].show = false;
  });

  // 更新警告面板
  const alertEl = document.getElementById('collisionAlert');
  if (worstLevel > 0) {
    alertEl.style.display = 'block';
    alertEl.className = worstLevel === 2 ? 'danger' : 'warn';
    alertEl.textContent = (worstLevel === 2 ? '🚨 碰撞危險' : '⚠️ 接近預警') +
      '  ' + worstPair + '  ' + worstDist.toFixed(1) + 'm';
  } else {
    alertEl.style.display = 'none';
  }
}

function updateUAVPosition(lat, lon, alt, headingDeg, speedMs, sysid, mode, armed, vehicleType, pitchDeg, rollDeg) {
  sysid = sysid || 1;
  const pos = Cesium.Cartesian3.fromDegrees(lon, lat, alt || 0);
  // 緩存最新姿態，供跟隨相機/其他模組使用
  _UAV_STATE[sysid] = {
    lat: lat, lon: lon, alt: alt || 0,
    heading: headingDeg || 0,
    pitch: pitchDeg || 0,
    roll: rollDeg || 0,
    speed: speedMs || 0,
  };
  const color = _UAV_COLORS[(sysid - 1) % _UAV_COLORS.length];
  _appendTrail(sysid, lat, lon, alt, color);
  const _vt = (vehicleType || '').toUpperCase();
  const isPlane = _vt.indexOf('PLANE') >= 0 || _vt.indexOf('FIXED') >= 0
                  || _vt.indexOf('VTOL') >= 0;   // VTOL (QuadPlane) 使用固定翼模型
  const icon = isPlane ? '✈' : '🚁';
  const labelTxt = icon + ' UAV' + sysid + (mode ? ' [' + mode + ']' : '') + (armed ? ' ●ARM' : '');

  // 計算 orientation（含姿態：heading + pitch + roll）
  const isPlaneGlb = isPlane && _PLANE_MODEL_URI && _PLANE_MODEL_URI.length > 0;
  const isCopterGlb = !isPlane && _COPTER_MODEL_URI && _COPTER_MODEL_URI.length > 0;
  let headingOffset = 0, pitchOffset = 0, rollOffset = 0;
  if (isPlaneGlb)  { headingOffset = _PLANE_HEADING_OFFSET;  pitchOffset = _PLANE_PITCH_OFFSET;  rollOffset = _PLANE_ROLL_OFFSET; }
  if (isCopterGlb) { headingOffset = _COPTER_HEADING_OFFSET; pitchOffset = _COPTER_PITCH_OFFSET; rollOffset = _COPTER_ROLL_OFFSET; }
  const hpr = new Cesium.HeadingPitchRoll(
    Cesium.Math.toRadians((headingDeg || 0) + headingOffset),
    Cesium.Math.toRadians((pitchDeg || 0) + pitchOffset),
    Cesium.Math.toRadians((rollDeg || 0) + rollOffset)
  );
  const orientation = Cesium.Transforms.headingPitchRollQuaternion(pos, hpr);

  let entity = uavEntities[sysid];
  if (!entity) {
    const useGlbModel = (isPlane && _PLANE_MODEL_URI && _PLANE_MODEL_URI.length > 0)
                     || (!isPlane && _COPTER_MODEL_URI && _COPTER_MODEL_URI.length > 0);
    const entityOpts = {
      name: 'UAV-' + sysid,
      position: new Cesium.ConstantPositionProperty(pos),
      orientation: new Cesium.ConstantProperty(orientation),
      billboard: {
        image: _uavSvg(color, vehicleType),
        scale: 1.1,
        rotation: Cesium.Math.toRadians(-(headingDeg || 0)),
        alignedAxis: Cesium.Cartesian3.UNIT_Z,
        heightReference: Cesium.HeightReference.NONE,
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
        // GLB 模型現在全距離顯示，平面圖示只在極遠(>80km)當 fallback，
        // 正常縮放下只看立體姿態模型。無 GLB 時平面圖示 800m 起接手。
        distanceDisplayCondition: useGlbModel
          ? new Cesium.DistanceDisplayCondition(80000.0, 1.0e8)
          : new Cesium.DistanceDisplayCondition(800.0, 1.0e8),
      },
      label: {
        text: labelTxt,
        font: 'bold 12px "Segoe UI",sans-serif',
        fillColor: Cesium.Color.fromCssColorString(color),
        outlineColor: Cesium.Color.BLACK,
        outlineWidth: 2.5,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        pixelOffset: new Cesium.Cartesian2(0, -32),
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
      },
    };

    if (isPlaneGlb) {
      console.log('[3D] 載入固定翼 GLB 模型:', _PLANE_MODEL_URI);
      entityOpts.model = {
        uri: _PLANE_MODEL_URI,
        minimumPixelSize: 32,
        maximumScale: 50,
        scale: 0.01,
        // 全距離顯示立體模型，遠看靠 minimumPixelSize 保持 ≥32px，姿態
        // (pitch/roll/yaw) 在任何縮放下都看得到（取代原本 >2000m 退化為平面圖示）。
        distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 1.0e8),
      };
    } else if (isCopterGlb) {
      console.log('[3D] 載入多旋翼 GLB 模型:', _COPTER_MODEL_URI);
      entityOpts.model = {
        uri: _COPTER_MODEL_URI,
        minimumPixelSize: 32,
        maximumScale: 50,
        scale: 0.01,
        // 全距離顯示立體模型，遠看靠 minimumPixelSize 保持 ≥32px，姿態
        // (pitch/roll/yaw) 在任何縮放下都看得到（取代原本 >2000m 退化為平面圖示）。
        distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 1.0e8),
      };
    } else if (isPlane) {
      entityOpts.box = {
        dimensions: new Cesium.Cartesian3(2.0, 12.0, 1.2),
        material: Cesium.Color.fromCssColorString(color).withAlpha(0.95),
        outline: true, outlineColor: Cesium.Color.BLACK,
        distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 800.0),
      };
    } else {
      entityOpts.ellipsoid = {
        radii: new Cesium.Cartesian3(8, 8, 2),
        material: Cesium.Color.fromCssColorString(color).withAlpha(0.95),
        outline: true, outlineColor: Cesium.Color.BLACK,
        distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 800.0),
      };
    }

    entity = viewer.entities.add(entityOpts);
    uavEntities[sysid] = entity;
    if (sysid === 1) uavEntity = entity;  // 舊 API 相容

    // 為固定翼 fallback 加上機翼（無 GLB 時）
    if (isPlane && !useGlbModel) {
      const wingEntity = viewer.entities.add({
        position: new Cesium.ConstantPositionProperty(pos),
        orientation: new Cesium.ConstantProperty(orientation),
        box: {
          dimensions: new Cesium.Cartesian3(16.0, 2.0, 0.4),
          material: Cesium.Color.fromCssColorString(color).withAlpha(0.85),
          outline: true, outlineColor: Cesium.Color.BLACK,
          distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 800.0),
        },
      });
      entity._wingChild = wingEntity;
    }
  } else {
    entity.position = new Cesium.ConstantPositionProperty(pos);
    entity.orientation = new Cesium.ConstantProperty(orientation);
    if (entity.billboard) entity.billboard.rotation = Cesium.Math.toRadians(-(headingDeg || 0));
    if (entity.label) entity.label.text = labelTxt;
    if (entity._wingChild) {
      entity._wingChild.position = new Cesium.ConstantPositionProperty(pos);
      entity._wingChild.orientation = new Cesium.ConstantProperty(orientation);
    }
  }

  // 碰撞檢測（每次位置更新都檢查）
  _checkCollisions();

  // 狀態列：顯示主控（sysid=1）的資訊
  if (sysid === 1) {
    const el = document.getElementById('sitlStatus');
    el.style.display = 'block';
    el.textContent =
      '✈ SITL[' + sysid + ']  ' + (mode || '') + (armed ? ' ARM' : ' DIS') +
      '  lat:' + lat.toFixed(5) + '  lon:' + lon.toFixed(5) +
      '  alt:' + (alt||0).toFixed(1) + 'm  hdg:' + (headingDeg||0).toFixed(0) + '°  ' +
      'pitch:' + (pitchDeg||0).toFixed(1) + '° roll:' + (rollDeg||0).toFixed(1) + '°  ' +
      'spd:' + (speedMs||0).toFixed(1) + 'm/s';
  }
}

function clearUAV(sysid) {
  function _rm(e) {
    try { if (e._wingChild) viewer.entities.remove(e._wingChild); } catch(_){}
    try { viewer.entities.remove(e); } catch(_){}
  }
  function _rmTrail(sid) {
    if (uavTrails[sid]) { try { viewer.entities.remove(uavTrails[sid]); } catch(_){} delete uavTrails[sid]; }
    if (uavTrailPts[sid]) delete uavTrailPts[sid];
  }
  if (sysid !== undefined && sysid !== null) {
    if (uavEntities[sysid]) { _rm(uavEntities[sysid]); delete uavEntities[sysid]; }
    delete _UAV_STATE[sysid];
    _rmTrail(sysid);
    if (_chaseSysid === sysid) setChaseCamera(0);
    if (_fpvSysid === sysid) setFpvCamera(0);
  } else {
    Object.values(uavEntities).forEach(_rm);
    uavEntities = {};
    uavEntity = null;
    Object.keys(_UAV_STATE).forEach(k => delete _UAV_STATE[k]);
    Object.keys(uavTrails).forEach(_rmTrail);
    if (_chaseSysid > 0) setChaseCamera(0);
    if (_fpvSysid > 0) setFpvCamera(0);
  }
  document.getElementById('sitlStatus').style.display = 'none';
}

// ══════════════════════════════════════════════════════════════════════
//  NFZ 繪製模式（多邊形 + 圓形）— Cesium 3D 端原生支援
//  ─────────────────────────────────────────────────────────────────────
//  POLYGON：左鍵點頂點、右鍵 / 雙擊 / Esc / 外部呼叫 finishNFZPolygon() 完成
//  CIRCLE ：兩段點擊（第一次點圓心、第二次點邊緣定半徑），Esc 取消
//
//  完成後透過 pyqt:// URL 橋接送回 Python（acceptNavigationRequest 攔截）
// ══════════════════════════════════════════════════════════════════════
var _nfzDrawMode = null;          // null | 'polygon' | 'circle'
var _nfzPolyVerts = [];           // [{lat, lon}, ...] 繪製中暫存
var _nfzPolyPreviewEntity = null; // 進行中的 polyline 預覽
var _nfzPolyDotEntities = [];     // 每個頂點的提示點
var _nfzCircleStart = null;       // {lat, lon} 圓心
var _nfzCirclePreviewEntity = null;
var _nfzCircleCenterDotEntity = null;
var _nfzCircleMouseMoveEntity = null;  // 隨滑鼠的「即時半徑預覽」

/**
 * 切換 NFZ 多邊形繪製模式
 *   true  → 進入繪製：左鍵點頂點，右鍵 / 雙擊 / Esc 完成
 *   false → 取消（清掉預覽，不送資料）
 */
function setNFZPolygonDrawMode(enabled) {
  _clearNFZPolyPreview();
  _clearNFZCirclePreview();
  if (enabled) {
    _nfzDrawMode = 'polygon';
    _nfzPolyVerts = [];
    _showNFZDrawHint(
      '🛑 繪製 NFZ 多邊形（至少 3 點）',
      '左鍵：新增頂點　│　右鍵 / 雙擊：完成　│　Esc：取消'
    );
    console.log('[NFZ Draw] polygon mode ON');
  } else {
    _nfzDrawMode = null;
    _hideNFZDrawHint();
    console.log('[NFZ Draw] polygon mode OFF');
  }
}

/**
 * 完成多邊形（≥3 頂點）— 把頂點打包成 pyqt://nfz_poly_done URL 送回 Python
 */
function finishNFZPolygon() {
  if (_nfzDrawMode !== 'polygon') return;
  if (_nfzPolyVerts.length < 3) {
    console.warn('[NFZ Draw] 頂點不足 ' + _nfzPolyVerts.length + ' < 3，取消');
    setNFZPolygonDrawMode(false);
    return;
  }
  var payload = _nfzPolyVerts
    .map(function (v) { return v.lat + ',' + v.lon; })
    .join('|');
  var verts = _nfzPolyVerts.slice();
  setNFZPolygonDrawMode(false);
  console.log('[NFZ Draw] polygon finish, n=' + verts.length);
  window.location.href = 'pyqt://nfz_poly_done/' + encodeURIComponent(payload);
}

/**
 * 切換 NFZ 圓形繪製模式（兩段點擊）
 *   true  → 進入繪製：左鍵點圓心 → 滑鼠移動即時預覽 → 左鍵點邊緣完成
 *   false → 取消
 *
 * 改成兩段點擊（不用拖曳）是因為 Cesium 預設左鍵 down+drag 是相機平移，
 * 即使停用相機 input 也偶爾失靈；兩段點擊行為穩定可靠。
 */
function setNFZCircleDrawMode(enabled) {
  _clearNFZPolyPreview();
  _clearNFZCirclePreview();
  if (enabled) {
    _nfzDrawMode = 'circle';
    _nfzCircleStart = null;
    _showNFZDrawHint(
      '🛑 繪製 NFZ 圓形（兩段點擊）',
      '左鍵：① 點圓心 → ② 點邊緣定半徑　│　Esc：取消'
    );
    console.log('[NFZ Draw] circle mode ON');
  } else {
    _nfzDrawMode = null;
    _hideNFZDrawHint();
    console.log('[NFZ Draw] circle mode OFF');
  }
}

function _clearNFZPolyPreview() {
  if (_nfzPolyPreviewEntity) {
    try { viewer.entities.remove(_nfzPolyPreviewEntity); } catch (_) {}
    _nfzPolyPreviewEntity = null;
  }
  _nfzPolyDotEntities.forEach(function (e) {
    try { viewer.entities.remove(e); } catch (_) {}
  });
  _nfzPolyDotEntities = [];
}

function _clearNFZCirclePreview() {
  if (_nfzCirclePreviewEntity) {
    try { viewer.entities.remove(_nfzCirclePreviewEntity); } catch (_) {}
    _nfzCirclePreviewEntity = null;
  }
  if (_nfzCircleCenterDotEntity) {
    try { viewer.entities.remove(_nfzCircleCenterDotEntity); } catch (_) {}
    _nfzCircleCenterDotEntity = null;
  }
  if (_nfzCircleMouseMoveEntity) {
    try { viewer.entities.remove(_nfzCircleMouseMoveEntity); } catch (_) {}
    _nfzCircleMouseMoveEntity = null;
  }
}

// ── 繪製模式浮動提示 banner（地圖頂部中央，純 HTML/CSS）──
function _showNFZDrawHint(title, hint) {
  var el = document.getElementById('nfzDrawHint');
  if (!el) {
    el = document.createElement('div');

function _redrawNFZPolyPreview() {

function _drawNFZCirclePreview(centerLat, centerLon, radiusM) {

function _pickLatLon(screenPos) {
  var ray = viewer.camera.getPickRay(screenPos);
  if (!ray) return null;
  var cart = viewer.scene.globe.pick(ray, viewer.scene);
  if (!cart) return null;
  var carto = Cesium.Ellipsoid.WGS84.cartesianToCartographic(cart);
  return {
    lat: Cesium.Math.toDegrees(carto.latitude),
    lon: Cesium.Math.toDegrees(carto.longitude),
  };
}

function _haversineM(lat1, lon1, lat2, lon2) {
  var R = 6371000.0;
  var dLat = Cesium.Math.toRadians(lat2 - lat1);
  var dLon = Cesium.Math.toRadians(lon2 - lon1);
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2)
        + Math.cos(Cesium.Math.toRadians(lat1))
        * Math.cos(Cesium.Math.toRadians(lat2))
        * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ── DEM 3D 地形（CustomHeightmapTerrainProvider 平滑版）─────
var demTerrainPrimitive = null;
var demHeightData = null;  // {data: Float32Array, rows, cols, latMin, latMax, lonMin, lonMax}
var demOriginalTerrain = null;
function clearDemTerrain() {
  if (demTerrainPrimitive) {
    viewer.scene.primitives.remove(demTerrainPrimitive);
    demTerrainPrimitive = null;
  }
  if (demOriginalTerrain) {
    viewer.terrainProvider = demOriginalTerrain;
    demOriginalTerrain = null;
  }
  demHeightData = null;
}
// 採樣 DEM 高程（雙線性插值）
function sampleDem(lat, lon) {
  if (!demHeightData) return 0;
  var d = demHeightData;
  if (lat < d.latMin || lat > d.latMax || lon < d.lonMin || lon > d.lonMax) return 0;
  var fy = (d.latMax - lat) / (d.latMax - d.latMin) * (d.rows - 1);
  var fx = (lon - d.lonMin) / (d.lonMax - d.lonMin) * (d.cols - 1);
  var y0 = Math.floor(fy), y1 = Math.min(y0 + 1, d.rows - 1);
  var x0 = Math.floor(fx), x1 = Math.min(x0 + 1, d.cols - 1);
  var dy = fy - y0, dx = fx - x0;
  var h00 = d.data[y0 * d.cols + x0];
  var h10 = d.data[y0 * d.cols + x1];
  var h01 = d.data[y1 * d.cols + x0];
  var h11 = d.data[y1 * d.cols + x1];
  return h00 * (1-dx)*(1-dy) + h10 * dx*(1-dy) + h01 * (1-dx)*dy + h11 * dx*dy;
}
// 建立 CustomHeightmapTerrainProvider 並套用
function applyDemTerrainProvider() {
  if (!demHeightData) return;
  if (!demOriginalTerrain) demOriginalTerrain = viewer.terrainProvider;
  var TILE_W = 32, TILE_H = 32;
  var provider = new Cesium.CustomHeightmapTerrainProvider({
    width: TILE_W,
    height: TILE_H,
    tilingScheme: new Cesium.GeographicTilingScheme(),
    callback: function(x, y, level) {
      // 計算 tile 地理範圍
      var rect = provider.tilingScheme.tileXYToRectangle(x, y, level);
      var west = Cesium.Math.toDegrees(rect.west);
      var east = Cesium.Math.toDegrees(rect.east);
      var south = Cesium.Math.toDegrees(rect.south);
      var north = Cesium.Math.toDegrees(rect.north);
      var arr = new Float32Array(TILE_W * TILE_H);
      for (var j = 0; j < TILE_H; j++) {
        var lat = north - (north - south) * j / (TILE_H - 1);
        for (var i = 0; i < TILE_W; i++) {
          var lon = west + (east - west) * i / (TILE_W - 1);
          arr[j * TILE_W + i] = sampleDem(lat, lon);
        }
      }
      return arr;
    },
  });
  viewer.terrainProvider = provider;
  viewer.scene.globe.enableLighting = true;
  console.log('[DEM3D] CustomHeightmapTerrainProvider 已套用');
}
// 新版：接收整份 DEM 陣列 → 套用 CustomHeightmapTerrainProvider
function showDemTerrainHeightmap(latMin, latMax, lonMin, lonMax, rows, cols, flatHeights) {
  clearDemTerrain();
  demHeightData = {
    data: new Float32Array(flatHeights),
    rows: rows, cols: cols,
    latMin: latMin, latMax: latMax, lonMin: lonMin, lonMax: lonMax,
  };
  applyDemTerrainProvider();
  viewer.camera.flyTo({
    destination: Cesium.Rectangle.fromDegrees(lonMin, latMin, lonMax, latMax),
    duration: 1.2,
  });
}
// 舊版方塊模式（保留以供比對）
function showDemTerrain3D(latMin, latMax, lonMin, lonMax, cellsFlat, minE, maxE) {
  clearDemTerrain();
  var instances = [];
  var rng = Math.max(maxE - minE, 1.0);
  function rampColor(t) {
    if (t < 0.25) { var k = t/0.25; return new Cesium.Color(0, k, 1, 1); }
    if (t < 0.5)  { var k = (t-0.25)/0.25; return new Cesium.Color(0, 1, 1-k, 1); }
    if (t < 0.75) { var k = (t-0.5)/0.25;  return new Cesium.Color(k, 1, 0, 1); }
    var k = (t-0.75)/0.25; return new Cesium.Color(1, 1-k, 0, 1);
  }
  for (var i = 0; i < cellsFlat.length; i += 5) {
    var la0 = cellsFlat[i];
    var lo0 = cellsFlat[i+1];
    var la1 = cellsFlat[i+2];
    var lo1 = cellsFlat[i+3];
    var h   = cellsFlat[i+4];
    var t = Math.max(0, Math.min(1, (h - minE) / rng));
    var color = rampColor(t);
    var rect = Cesium.Rectangle.fromDegrees(lo0, la0, lo1, la1);
    var geom = new Cesium.RectangleGeometry({
      rectangle: rect,
      height: Math.max(h, 0),
      vertexFormat: Cesium.PerInstanceColorAppearance.VERTEX_FORMAT,
    });
    instances.push(new Cesium.GeometryInstance({
      geometry: geom,
      attributes: {
        color: Cesium.ColorGeometryInstanceAttribute.fromColor(color),
      },
    }));
  }
  demTerrainPrimitive = viewer.scene.primitives.add(new Cesium.Primitive({
    geometryInstances: instances,
    appearance: new Cesium.PerInstanceColorAppearance({
      flat: false,
      translucent: false,
    }),
    asynchronous: false,
  }));
  // 飛到區域
  viewer.camera.flyTo({
    destination: Cesium.Rectangle.fromDegrees(lonMin, latMin, lonMax, latMax),
    duration: 1.2,
  });
  console.log('[DEM3D] 已載入 ' + instances.length + ' 格, 高程 ' + minE.toFixed(0) + '~' + maxE.toFixed(0) + 'm');
}

function setInitialView(lat, lon, height) {

    destination: Cesium.Cartesian3.fromDegrees(lon, lat, height || 2000),

  });
}

// ══════════════════════════════════════════════════════════════════════
//  模組一：FSDM 高程切片分析 (Elevation Slicing)
//  基於「特徵選擇決策模型」，將地形依高度區間分色渲染，
//  識別低空突防盲區走廊。
// ══════════════════════════════════════════════════════════════════════
let _elevSlicerActive = false;

/**
 * 更新高程切片視覺化
 * @param {number} minAlt  最低安全高度 (m)
 * @param {number} maxAlt  最高突防高度 (m)
 *
 * 原理：利用 Cesium Globe 的 material 修改，
 * 將地表依高程分為三個色帶：
 *   低於 minAlt → 暗灰色（遮蔽地形）
 *   minAlt ~ maxAlt → 半透明安全綠色（盲區走廊）
 *   高於 maxAlt → 暗黑色（障礙地形）
 *
 * Cesium 1.115 使用 Globe.material 搭配自訂 fabric 實現
 * ElevationBand 效果。
 */
function updateElevationSlicer(minAlt, maxAlt) {
  const globe = viewer.scene.globe;

  if (minAlt === undefined || maxAlt === undefined || minAlt >= maxAlt) {
    // 關閉切片：還原為預設材質
    globe.material = undefined;
    _elevSlicerActive = false;
    console.log('[FSDM] 高程切片已關閉');
    return;
  }

  // 使用 Cesium Fabric 定義自訂 Globe Material
  // 依片元高度（positionMC.z 近似橢球高度）分色
  globe.material = new Cesium.Material({
    fabric: {
      type: 'ElevationSlicer',
      uniforms: {
        minAlt: minAlt,
        maxAlt: maxAlt,
        // 安全走廊色：半透明綠
        safeColor: new Cesium.Color(0.0, 0.9, 0.3, 0.45),
        // 遮蔽色：暗灰黑
        blockedColor: new Cesium.Color(0.12, 0.12, 0.15, 0.85),
      },
      source:
        'uniform float minAlt;\n' +
        'uniform float maxAlt;\n' +
        'uniform vec4 safeColor;\n' +
        'uniform vec4 blockedColor;\n' +
        'czm_material czm_getMaterial(czm_materialInput materialInput) {\n' +
        '  czm_material material = czm_getDefaultMaterial(materialInput);\n' +
        '  // 取得片元的橢球高度（公尺）\n' +
        '  float height = materialInput.height;\n' +
        '  if (height >= minAlt && height <= maxAlt) {\n' +
        '    // 盲區走廊：安全綠色半透明覆蓋\n' +
        '    material.diffuse = safeColor.rgb;\n' +
        '    material.alpha = safeColor.a;\n' +
        '  } else {\n' +
        '    // 超出走廊範圍：暗色遮蔽\n' +
        '    material.diffuse = blockedColor.rgb;\n' +
        '    material.alpha = blockedColor.a;\n' +
        '  }\n' +
        '  return material;\n' +
        '}\n',
    },
  });

  // 備援方案：若自訂 fabric 不支援 materialInput.height，
  // 改用 ElevationBand 色帶（Cesium 1.115 支援）
  try {
    const layers = [
      // 低於最低安全高度 → 暗灰黑
      { entries: [
        { height: -500.0, color: new Cesium.Color(0.12, 0.12, 0.15, 0.85) },
        { height: minAlt - 0.1, color: new Cesium.Color(0.12, 0.12, 0.15, 0.85) },
      ]},
      // 安全走廊 → 綠色半透明
      { entries: [
        { height: minAlt, color: new Cesium.Color(0.0, 0.9, 0.3, 0.45) },
        { height: maxAlt, color: new Cesium.Color(0.0, 0.9, 0.3, 0.45) },
      ]},
      // 高於最高突防高度 → 暗黑
      { entries: [
        { height: maxAlt + 0.1, color: new Cesium.Color(0.08, 0.08, 0.1, 0.9) },
        { height: 9000.0, color: new Cesium.Color(0.08, 0.08, 0.1, 0.9) },
      ]},
    ];
    globe.material = Cesium.createElevationBandMaterial({
      scene: viewer.scene,
      layers: layers,
    });
  } catch(e) {
    console.warn('[FSDM] ElevationBand fallback 失敗，使用基本材質', e);
  }

  _elevSlicerActive = true;
  console.log('[FSDM] 高程切片啟用: ' + minAlt + 'm ~ ' + maxAlt + 'm');
}

/**
 * 清除高程切片，還原正常地圖
 */
function clearElevationSlicer() {
  viewer.scene.globe.material = undefined;
  _elevSlicerActive = false;
  console.log('[FSDM] 高程切片已清除');
}


// ══════════════════════════════════════════════════════════════════════
//  模組二：FOV 光錐 + 動態搜救機率熱力圖 (SAR Probability Heatmap)
//  目標發現機率遵循指數探測定律：P_detect = 1 - exp(-W * q)
//  累積發現機率 (COS) 隨掃過次數遞增
// ══════════════════════════════════════════════════════════════════════
// ★ 多機 FOV 支援：每架 UAV 一個獨立 entity + state，避免互相覆寫造成
//   「FOV 跳到誰那就顯示誰」閃爍與「一次只能顯示一台」問題。
let fovConeEntities    = {};    // {sysid: cylinder entity}
let fovOutlineEntities = {};    // {sysid: ellipse entity}      ─ legacy circular cone 用
let fovEdgeEntities    = {};    // {sysid: [polyline x4]}        ─ pyramid frustum 4 條邊
let fovGroundPolyEntities = {}; // {sysid: polyline entity}      ─ frustum 地面封閉迴圈 (wireframe)
let fovFillPrimitives  = {};    // {sysid: Cesium.Primitive}     ─ GPU 半透明填色（baked 幾何）
let _fovStates         = {};    // {sysid: {lat, lon, alt, radius, heading, pitch, roll,
                                //          hfov, vfov, mountAngle, mode, lastUpdate,
                                //          _cornersKey, _cornersCache}}
// 向後相容（舊全域變數，未使用，避免外部呼叫 ReferenceError）
let fovConeEntity = null;
let fovOutlineEntity = null;
let heatmapEntities = [];       // 熱力圖網格 Entity 陣列
let heatmapGrid = null;         // 網格狀態 {rows, cols, cells: [{lat, lon, cos, entity}]}
let _heatmapSweepWidth = 50.0;  // 掃描有效寬度 W (公尺)
let _heatmapQuality = 0.8;      // 探測品質 q (0~1)

/**
 * 計算 frustum Primitive 的 modelMatrix（位置/航向/高度純 GPU 變換）
 *
 *   modelMatrix = ENU(lat,lon,alt) × RotZ(-heading) × ScaleUniform(alt)
 *
 * - canonical body frame 中：apex 在原點 (0,0,0)、角點在 (dx, dy, -1)
 * - Scale(alt) 把 z=-1 的角點拉到地面 z=-alt（uniform scale 不會破壞角度）
 * - RotZ(-h) 把 body +y 對齊到 heading h 的方位（ENU 右手系、CW = 負角）
 * - ENU 把原點放到 UAV 經緯高，整個角錐 apex 自動坐落在 UAV 模型上
 *
 * @param {Object} s  _fovStates[sysid] 狀態物件
 * @returns {Cesium.Matrix4}  4x4 變換矩陣
 */
function _computeFrustumModelMatrix(s) {
  var origin = Cesium.Cartesian3.fromDegrees(s.lon, s.lat, s.alt);
  var enuMatrix = Cesium.Transforms.eastNorthUpToFixedFrame(origin);
  var h = Cesium.Math.toRadians(s.heading || 0);
  // CW heading（北 0、東 90）→ ENU +Z 軸的 CCW 旋轉為 -h
  var rotZ = Cesium.Matrix3.fromRotationZ(-h);
  var rotMatrix = Cesium.Matrix4.fromRotationTranslation(
    rotZ, Cesium.Cartesian3.ZERO
  );
  var scale = Math.max(1.0, s.alt || 100.0);
  var scaleMatrix = Cesium.Matrix4.fromScale(
    new Cesium.Cartesian3(scale, scale, scale)
  );
  var tmp = new Cesium.Matrix4();
  Cesium.Matrix4.multiply(enuMatrix, rotMatrix, tmp);
  Cesium.Matrix4.multiply(tmp, scaleMatrix, tmp);
  return tmp;
}

/**
 * 依當前 HFOV / VFOV / 掛載角 烘焙 canonical body-frame 的 frustum 三角網格，
 * 並包成 GPU Primitive（PerInstanceColorAppearance + 半透明）。
 *
 * canonical 頂點：
 *   v0 = apex (0,0,0)
 *   v1..v4 = 4 個 ground corner 在 z = -1 平面：(dx_b/|dz_b|, dy_b/|dz_b|, -1)
 *
 * 索引：4 側面三角形 (apex, c_i, c_{i+1}) + 2 地面三角形 (c0,c1,c2)(c0,c2,c3)
 *
 * @param {number} sysid
 * @param {Cesium.Color} color
 * @returns {Cesium.Primitive | null}
 */
function _buildFrustumPrimitive(sysid, color) {
  var s = _fovStates[sysid];
  if (!s) return null;

  var am = Cesium.Math.toRadians(Math.max(0, Math.min(89.5, s.mountAngle || 0)));
  var hfovHalf = Cesium.Math.toRadians(Math.max(1, Math.min(85, (s.hfov || 60) / 2)));
  var vfovHalf = Cesium.Math.toRadians(Math.max(1, Math.min(85, (s.vfov || 45) / 2)));
  var sinAm = Math.sin(am), cosAm = Math.cos(am);
  var tanH = Math.tan(hfovHalf), tanV = Math.tan(vfovHalf);

  // 與 _computeFrustumGroundCorners 同一組 SIGNS 順序：TL, TR, BR, BL
  var SIGNS = [[-1, +1], [+1, +1], [+1, -1], [-1, -1]];
  var c = [];   // [[x,y,z], ...]
  for (var i = 0; i < 4; i++) {
    var sx = SIGNS[i][0], sy = SIGNS[i][1];
    var dxB = sx * tanH;
    var dyB = sinAm + sy * tanV * cosAm;
    var dzB = -cosAm + sy * tanV * sinAm;
    if (dzB >= -1e-6) {
      // 射線指向上方或水平 → 用遠處替代（不會渲染負無限大）
      c.push([dxB * 10, dyB * 10, -1.0]);
    } else {
      var inv = 1.0 / Math.abs(dzB);
      c.push([dxB * inv, dyB * inv, -1.0]);
    }
  }

  // Float64 頂點：apex + 4 corners
  var positions = new Float64Array([
    0.0,    0.0,    0.0,     // 0: apex
    c[0][0], c[0][1], c[0][2], // 1: TL
    c[1][0], c[1][1], c[1][2], // 2: TR
    c[2][0], c[2][1], c[2][2], // 3: BR
    c[3][0], c[3][1], c[3][2], // 4: BL
  ]);

  // 6 個三角形（4 側面 + 2 地面四邊形分割）
  var indices = new Uint16Array([
    0, 1, 2,   // 側 TL→TR
    0, 2, 3,   // 側 TR→BR
    0, 3, 4,   // 側 BR→BL
    0, 4, 1,   // 側 BL→TL
    1, 2, 3,   // 地面 △1
    1, 3, 4,   // 地面 △2
  ]);

  var geometry = new Cesium.Geometry({
    attributes: {
      position: new Cesium.GeometryAttribute({
        componentDatatype: Cesium.ComponentDatatype.DOUBLE,
        componentsPerAttribute: 3,
        values: positions,
      }),
    },
    indices: indices,
    primitiveType: Cesium.PrimitiveType.TRIANGLES,
    boundingSphere: Cesium.BoundingSphere.fromVertices(positions),
  });

  var instance = new Cesium.GeometryInstance({
    geometry: geometry,
    modelMatrix: _computeFrustumModelMatrix(s),
    attributes: {
      color: Cesium.ColorGeometryInstanceAttribute.fromColor(
        color.withAlpha(0.20)
      ),
    },
    id: 'fov-fill-uav' + sysid,
  });

  return new Cesium.Primitive({
    geometryInstances: instance,
    appearance: new Cesium.PerInstanceColorAppearance({
      translucent: true,
      closed: false,
      flat: true,
    }),
    asynchronous: false,   // 立即建好以避免閃爍
  });
}

/**
 * 確保該 sysid 有 frustum Primitive；shape 不變則只更新 modelMatrix（GPU side）。
 *
 *   - 首次呼叫     → 建 Primitive
 *   - HFOV/VFOV/α_m 變 → 拆掉重建（重建只發生在使用者拖滑桿時，極低頻）
 *   - 其它 (lat/lon/alt/heading) 變 → 只改 primitive.modelMatrix，純 GPU
 */
function _ensureFrustumFillPrimitive(sysid, color) {
  var s = _fovStates[sysid];
  if (!s) return;
  var shapeKey = (s.hfov || 0) + '|' + (s.vfov || 0) + '|' + (s.mountAngle || 0);
  var prim = fovFillPrimitives[sysid];
  if (prim && prim._shapeKey === shapeKey) {
    // 形狀沒變 → 只更新矩陣（每幀的位置/航向/高度變動走這條，零幾何重建）
    prim.modelMatrix = _computeFrustumModelMatrix(s);
    return;
  }
  // shape 變了或首次：拆舊建新
  if (prim) {
    try { viewer.scene.primitives.remove(prim); } catch (_) {}
    delete fovFillPrimitives[sysid];
  }
  var newPrim = _buildFrustumPrimitive(sysid, color);
  if (newPrim) {
    newPrim._shapeKey = shapeKey;
    fovFillPrimitives[sysid] = viewer.scene.primitives.add(newPrim);
  }
}

/**
 * 4 點凸多邊形的點面內判定（用於熱力圖梯形覆蓋判定）
 *
 * 利用「對所有相鄰邊的 cross product 符號一致」判定點是否在凸多邊形內：
 *   - 若四條邊的 (邊向量 × 點向量) 同號 → 點在內部
 *   - 任一條符號相反 → 點在外部
 *
 * 在小範圍 (km 級) 內，lat/lon 平面近似為歐式平面，直接用度數做 cross
 * 不會明顯失真。對 SAR 搜救熱力圖網格（通常 < 5 km × 5 km）足夠精準。
 *
 * @param {number} lat   待測點緯度
 * @param {number} lon   待測點經度
 * @param {Array}  quad  [{lat, lon} × 4] 依固定順序 (TL/TR/BR/BL)
 * @returns {boolean}
 */
function _pointInConvexQuad(lat, lon, quad) {
  let prev = quad[3];
  let sign = 0;
  for (let i = 0; i < 4; i++) {
    const cur = quad[i];
    const ex = cur.lon - prev.lon;
    const ey = cur.lat - prev.lat;
    const px = lon - prev.lon;
    const py = lat - prev.lat;
    const cross = ex * py - ey * px;
    if (cross !== 0) {
      if (sign === 0) {
        sign = cross > 0 ? 1 : -1;
      } else if ((sign > 0) !== (cross > 0)) {
        return false;
      }
    }
    prev = cur;
  }
  return true;
}

/**
 * 計算矩形角錐 frustum 的 4 個地面投影頂點（梯形 FOV）
 *
 * 數學模型（論文 Eq. 2-3 對應）：
 *   - 載具體座標：+x = 右、+y = 前、+z = 上
 *   - 光軸方向：axis_b = (0, sin(α_m), -cos(α_m))
 *     α_m = 0 → 垂直朝下（nadir，矩形投影）
 *     α_m > 0 → 前傾安裝（梯形投影：遠端寬、近端窄）
 *   - 影像右向：r_b = (1, 0, 0)
 *   - 影像上向：u_b = r_b × axis_b = (0, cos(α_m), sin(α_m))
 *   - 角錐 4 邊射線：dir = axis ± tan(HFOV/2)·r ± tan(VFOV/2)·u
 *   - 套用 heading 旋轉至 ENU，與 z=0 地平面相交即得 ground corner
 *
 * @param {Object} s  _fovStates[sysid] 狀態物件
 * @returns {Array<Cesium.Cartesian3>}  4 個 Cartesian3 地面點（順序：TL, TR, BR, BL）
 */
function _computeFrustumGroundCorners(s) {
  // ── Memoization：相同 state 直接回傳快取（避免每幀 5 次重複 trig） ──
  // Callback 每幀觸發（4 條邊 + 1 個地面 loop = 5 次/UAV/幀），
  // 多機時計算量會 N×5×60Hz，必須對未變化 state 做 short-circuit。
  var key = s.lat + '|' + s.lon + '|' + s.alt + '|' + (s.heading || 0)
            + '|' + (s.mountAngle || 0) + '|' + (s.hfov || 0) + '|' + (s.vfov || 0);
  if (s._cornersKey === key && s._cornersCache) {
    return s._cornersCache;
  }

  var h  = Cesium.Math.toRadians(s.heading || 0);
  var am = Cesium.Math.toRadians(Math.max(0, Math.min(89.5, s.mountAngle || 0)));
  // 半角，clamp 至安全範圍（避免 tan 發散）
  var hfovHalf = Cesium.Math.toRadians(Math.max(1, Math.min(85, (s.hfov || 60) / 2)));
  var vfovHalf = Cesium.Math.toRadians(Math.max(1, Math.min(85, (s.vfov || 45) / 2)));

  var sinAm = Math.sin(am), cosAm = Math.cos(am);
  var tanH = Math.tan(hfovHalf), tanV = Math.tan(vfovHalf);

  // 4 個影像角點：TL(-,+), TR(+,+), BR(+,-), BL(-,-)
  // 影像上 = 前方（遠端）、影像下 = 後方（近端）
  var SIGNS = [[-1, +1], [+1, +1], [+1, -1], [-1, -1]];
  var corners = [];     // Cartesian3[]：給 Cesium polyline 用
  var cornersLL = [];   // {lat, lon}[]：給熱力圖點面內判定用（共享同次計算）

  var cosLat = Math.cos(Cesium.Math.toRadians(s.lat));
  if (Math.abs(cosLat) < 1e-9) cosLat = 1e-9;

  for (var i = 0; i < 4; i++) {
    var sx = SIGNS[i][0], sy = SIGNS[i][1];
    // 體座標射線方向（未正規化即可，後續比例求交點）
    var dxB = sx * tanH;
    var dyB = sinAm + sy * tanV * cosAm;
    var dzB = -cosAm + sy * tanV * sinAm;

    // 套 heading：體 → ENU
    //   east  =  cos(h)·xB + sin(h)·yB
    //   north = -sin(h)·xB + cos(h)·yB
    //   up    =  zB
    var dE =  Math.cos(h) * dxB + Math.sin(h) * dyB;
    var dN = -Math.sin(h) * dxB + Math.cos(h) * dyB;
    var dU =  dzB;

    var t;
    if (dU >= -1e-6) {
      // 射線指向上方或水平 → 投影至遠處（10×alt）避免無窮大
      t = (s.alt || 100) * 10.0;
    } else {
      t = -(s.alt || 100) / dU;
    }

    var offE = dE * t;
    var offN = dN * t;
    var dLat = offN / 111320.0;
    var dLon = offE / (111320.0 * cosLat);

    corners.push(Cesium.Cartesian3.fromDegrees(
      s.lon + dLon, s.lat + dLat, 1.0
    ));
    cornersLL.push({ lat: s.lat + dLat, lon: s.lon + dLon });
  }
  // 寫入快取（同時暴露 lat/lon 版本給熱力圖點面內判定用）
  s._cornersKey = key;
  s._cornersCache = corners;
  s._cornersLL = cornersLL;
  return corners;
}

/**
 * 更新 FOV 光錐狀態（支援梯形角錐 frustum + 圓錐 legacy 兩模式）
 *
 * 設計改良：
 * 1. 使用 CallbackProperty 讓 Cesium 自行在渲染迴圈中讀取最新狀態，
 *    避免每幀重建 ConstantPositionProperty 造成的跳動。
 * 2. 提供 hfovDeg / vfovDeg / mountAngleDeg 時 → 矩形角錐 frustum 模式
 *    （4 條 polyline 邊 + 地面四邊形 polygon，掛載角即時投影成梯形）
 *    未提供時 → 退回原有圓錐（cylinder + ellipse）相容舊呼叫端。
 * 3. 內建 100ms 節流，避免高頻遙測導致 GPU 過載。
 *
 * @param {number} sysid          UAV 系統 ID（1-12）
 * @param {number} lat            UAV 緯度
 * @param {number} lon            UAV 經度
 * @param {number} alt            UAV 高度 (m)
 * @param {number} fovRadius      地面投影半徑 (m)，legacy 圓錐模式用
 * @param {number} headingDeg     航向角 (度)
 * @param {number} pitchDeg       俯仰角 (度)，legacy 圓錐地面投影偏移
 * @param {number} rollDeg        滾轉角 (度)
 * @param {number} [hfovDeg]      水平 FOV 全角 (度)，>0 啟用 frustum 模式
 * @param {number} [vfovDeg]      垂直 FOV 全角 (度)，>0 啟用 frustum 模式
 * @param {number} [mountAngleDeg] 感測器掛載角 α_m (度)，0=nadir，>0 前傾
 */
function updateFOVCone(sysid, lat, lon, alt, fovRadius, headingDeg, pitchDeg, rollDeg,
                       hfovDeg, vfovDeg, mountAngleDeg) {
  // 向後相容：若舊呼叫端未傳 sysid（第一個參數是 lat），順移所有參數
  if (typeof sysid === 'number' && (sysid > 90 || sysid < -90)) {
    // sysid 應為整數 1-12，若值像 lat（>90 或 <-90 屬於緯度範圍）→ 視為舊式呼叫
    rollDeg = pitchDeg; pitchDeg = headingDeg; headingDeg = fovRadius;
    fovRadius = alt; alt = lon; lon = lat; lat = sysid; sysid = 1;
  }
  sysid = sysid || 1;

  if (lat == null || lon == null || !(alt > 0)) {   // 0,0 是有效經緯度，勿用 falsy 判斷
    _removeFOVConeForSysid(sysid);
    return;
  }

  // 是否使用 pyramid frustum 模式（必須同時給 HFOV+VFOV）
  var usePyramid = (typeof hfovDeg === 'number' && typeof vfovDeg === 'number'
                    && hfovDeg > 0 && vfovDeg > 0);
  var newMode = usePyramid ? 'pyramid' : 'cylinder';

  if (!_fovStates[sysid]) {
    _fovStates[sysid] = {
      lat: 0, lon: 0, alt: 100, radius: 50,
      heading: 0, pitch: 0, roll: 0,
      hfov: 0, vfov: 0, mountAngle: 0,
      mode: null, lastUpdate: 0,
    };
  }
  var st = _fovStates[sysid];
  st.lat = lat; st.lon = lon; st.alt = alt;
  st.radius = fovRadius || (alt * 0.6);
  st.heading = headingDeg || 0;
  st.pitch = pitchDeg || 0;
  st.roll = rollDeg || 0;
  st.hfov = hfovDeg || 0;
  st.vfov = vfovDeg || 0;
  st.mountAngle = mountAngleDeg || 0;

  // 模式切換 → 移除舊 entity 強制重建（但保留 state）
  if (st.mode && st.mode !== newMode &&
      (fovConeEntities[sysid] || fovEdgeEntities[sysid])) {
    var savedState = Object.assign({}, st);
    _removeFOVConeForSysid(sysid);
    _fovStates[sysid] = savedState;
    st = _fovStates[sysid];
  }
  st.mode = newMode;

  // 節流 100ms — 期間僅更新 state，CallbackProperty 自動讀取
  var now = Date.now();
  var hasEntity = usePyramid
    ? !!fovGroundPolyEntities[sysid]
    : !!fovConeEntities[sysid];
  if (now - st.lastUpdate < 100 && hasEntity) {
    // 節流期內：仍要把 modelMatrix 推給 GPU Primitive
    // （shape 沒變只會走純矩陣更新分支，零幾何重建）
    if (usePyramid) {
      var coneColorCached = (typeof _UAV_COLORS !== 'undefined' && _UAV_COLORS.length > 0)
        ? Cesium.Color.fromCssColorString(_UAV_COLORS[(sysid - 1) % _UAV_COLORS.length])
        : Cesium.Color.fromCssColorString('#FFB703');
      _ensureFrustumFillPrimitive(sysid, coneColorCached);
    }
    return;
  }
  st.lastUpdate = now;

  // entity 已存在 → 不重建（CallbackProperty 會拉新值）+ 仍要更新 GPU 矩陣
  if (hasEntity) {
    if (usePyramid) {
      var coneColor2 = (typeof _UAV_COLORS !== 'undefined' && _UAV_COLORS.length > 0)
        ? Cesium.Color.fromCssColorString(_UAV_COLORS[(sysid - 1) % _UAV_COLORS.length])
        : Cesium.Color.fromCssColorString('#FFB703');
      _ensureFrustumFillPrimitive(sysid, coneColor2);
    }
    return;
  }

  // 首次建立 — 用該機 sysid 對應顏色（與 UAV polyline 同色，方便辨認）
  var color = (typeof _UAV_COLORS !== 'undefined' && _UAV_COLORS.length > 0)
    ? _UAV_COLORS[(sysid - 1) % _UAV_COLORS.length]
    : '#FFB703';
  var coneColor = Cesium.Color.fromCssColorString(color);

  // 注意：CallbackProperty 內必須用 closure 抓 sysid（不能用外層 var）
  var sid = sysid;

  if (usePyramid) {
    // ── 矩形角錐 frustum：GPU Primitive 半透明填色 + 4 條邊 polyline + 地面 wireframe ──
    // GPU 填色：幾何只 bake 一次，每幀只更新 modelMatrix（無 CPU 三角化）
    _ensureFrustumFillPrimitive(sid, coneColor);

    fovEdgeEntities[sid] = [];
    for (var i = 0; i < 4; i++) {
      (function (idx) {
        fovEdgeEntities[sid].push(viewer.entities.add({
          name: 'FOV-Edge-' + idx + '-UAV' + sid,
          polyline: {
            positions: new Cesium.CallbackProperty(function () {
              var s = _fovStates[sid];
              if (!s) return [];
              var apex = Cesium.Cartesian3.fromDegrees(s.lon, s.lat, s.alt);
              var corners = _computeFrustumGroundCorners(s);
              return [apex, corners[idx]];
            }, false),
            width: 1.5,
            material: coneColor.withAlpha(0.85),
            arcType: Cesium.ArcType.NONE,
          },
        }));
      })(i);
    }

    // 地面 footprint：用 closed-loop polyline 取代 polygon
    //   → 避免 Cesium 每幀對 polygon hierarchy 做 CPU 三角化（卡頓主因）
    //   → polyline 走 GPU vertex buffer 更新，多機高速重繪也順暢
    fovGroundPolyEntities[sid] = viewer.entities.add({
      name: 'FOV-GroundLoop-UAV' + sid,
      polyline: {
        positions: new Cesium.CallbackProperty(function () {
          var s = _fovStates[sid];
          if (!s) return [];
          var c = _computeFrustumGroundCorners(s);
          // 5 點封閉迴圈（c0→c1→c2→c3→c0）
          return [c[0], c[1], c[2], c[3], c[0]];
        }, false),
        width: 2.5,
        material: coneColor.withAlpha(0.85),
        arcType: Cesium.ArcType.NONE,
      },
    });

    console.log('[FOV] UAV' + sid + ' 梯形角錐 frustum 建立（H/V/α_m='
                + (hfovDeg | 0) + '/' + (vfovDeg | 0) + '/' + (mountAngleDeg | 0)
                + '°, color=' + color + '）');
  } else {
    // ── Legacy 圓錐模式 ──
    fovConeEntities[sid] = viewer.entities.add({
      name: 'FOV-Cone-UAV' + sid,
      position: new Cesium.CallbackProperty(function () {
        var s = _fovStates[sid];
        if (!s) return Cesium.Cartesian3.ZERO;
        return Cesium.Cartesian3.fromDegrees(s.lon, s.lat, s.alt / 2.0);
      }, false),
      orientation: new Cesium.CallbackProperty(function () {
        var s = _fovStates[sid];
        if (!s) return Cesium.Quaternion.IDENTITY;
        var pos = Cesium.Cartesian3.fromDegrees(s.lon, s.lat, s.alt / 2.0);
        var hpr = new Cesium.HeadingPitchRoll(
          Cesium.Math.toRadians(s.heading), 0, 0
        );
        return Cesium.Transforms.headingPitchRollQuaternion(pos, hpr);
      }, false),
      cylinder: {
        length: new Cesium.CallbackProperty(function () {
          var s = _fovStates[sid];
          return Math.max((s ? s.alt : 100), 10);
        }, false),
        topRadius: 0.5,
        bottomRadius: new Cesium.CallbackProperty(function () {
          var s = _fovStates[sid];
          return s ? s.radius : 50;
        }, false),
        material: coneColor.withAlpha(0.15),
        outline: true,
        outlineColor: coneColor.withAlpha(0.5),
        numberOfVerticalLines: 8,
        slices: 24,
      },
    });

    fovOutlineEntities[sid] = viewer.entities.add({
      name: 'FOV-Ground-Ring-UAV' + sid,
      position: new Cesium.CallbackProperty(function () {
        var s = _fovStates[sid];
        if (!s) return Cesium.Cartesian3.ZERO;
        var pitchRad = Cesium.Math.toRadians(s.pitch || 0);
        var hdgRad = Cesium.Math.toRadians(s.heading || 0);
        var offsetM = s.alt * Math.tan(Math.min(Math.abs(pitchRad), 0.6));
        var dLat = offsetM * Math.cos(hdgRad) / 111320.0;
        var dLon = offsetM * Math.sin(hdgRad)
                   / (111320.0 * Math.cos(Cesium.Math.toRadians(s.lat)));
        return Cesium.Cartesian3.fromDegrees(s.lon + dLon, s.lat + dLat, 1.0);
      }, false),
      ellipse: {
        semiMajorAxis: new Cesium.CallbackProperty(function () {
          var s = _fovStates[sid];
          return s ? s.radius : 50;
        }, false),
        semiMinorAxis: new Cesium.CallbackProperty(function () {
          var s = _fovStates[sid];
          return s ? s.radius : 50;
        }, false),
        material: coneColor.withAlpha(0.08),
        outline: true,
        outlineColor: coneColor.withAlpha(0.65),
        outlineWidth: 2,
        height: 0.5,
      },
    });

    console.log('[FOV] UAV' + sid + ' 圓錐 Entity 建立（color=' + color + '）');
  }
}

function _removeFOVConeForSysid(sysid) {
  // legacy 圓錐
  if (fovConeEntities[sysid]) {
    try { viewer.entities.remove(fovConeEntities[sysid]); } catch (_) {}
    delete fovConeEntities[sysid];
  }
  if (fovOutlineEntities[sysid]) {
    try { viewer.entities.remove(fovOutlineEntities[sysid]); } catch (_) {}
    delete fovOutlineEntities[sysid];
  }
