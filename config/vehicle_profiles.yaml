      gimbal_pitch_max_deg: 30
    
    waypoint_radius_m: 2.0
    loiter_radius_m: 5.0
    rtl_altitude_m: 50.0

# ==========================================
# 固定翼無人機配置（預留）
# ==========================================
fixed_wing:
  # ★ 預設固定翼平台：FMS Ranger 1220mm V2
  #   規格頁: https://www.fnrc.com.tw/index.php?action=pro_detail&id=373
  #   翼展/長/重/動力為原廠規格；速度與轉彎半徑依 1220mm/1kg 教練機氣動推導
  #   （規格頁未列速度）。轉彎半徑 R = V²/(g·tanφ) @ cruise 13 m/s, bank 40°。
  ranger_1220:
    name: "FMS Ranger 1220mm"
    type: "fixed_wing"
    manufacturer: "FMS"

    mass_kg: 1.0                    # 起飛重量（不含浮筒）
    max_payload_kg: 0.2
    wingspan_m: 1.22               # 翼展
    fuselage_length_m: 0.947       # 機身長

    # 動力（原廠配置）
    motor_kv: 1200                 # 3136-1200KV
    esc_a: 20                      # 20A 電調
    propeller: "10x5"              # 10×5 雙葉
    servo_count: 4                 # 9g × 4

    # 速度範圍（教練機典型包線，規格頁未列）
    stall_speed_mps: 7.0           # 失速速度（最低飛行速度）
    cruise_speed_mps: 13.0         # 巡航速度
    max_speed_mps: 26.0            # 最大速度

    # 續航力
    max_flight_time_min: 10
    max_range_km: 7
    battery_capacity_mah: 2200     # 典型 3S 2200mAh（規格頁未列）

    # 飛行限制
    max_altitude_m: 500
    service_ceiling_m: 1000
    max_wind_speed_mps: 8.0        # 輕量教練機，抗風較弱

    # 轉彎性能（關鍵參數）
    min_turn_radius_m: 25.0        # 最小轉彎半徑（@cruise, bank 40°）
    max_bank_angle_deg: 40.0       # 最大傾斜角
    recommended_turn_radius_m: 40.0  # 建議轉彎半徑（留餘量）

    # 起飛性能
    takeoff_distance_m: 25
    takeoff_climb_angle_deg: 15.0
    min_takeoff_speed_mps: 9.0     # ≈1.3 × 失速

    # 降落性能
    landing_distance_m: 30
    approach_speed_mps: 10.0       # ≈1.4 × 失速
    glide_slope_deg: 6.0

    # 任務參數
    waypoint_radius_m: 20.0
    loiter_radius_m: 40.0
    rtl_altitude_m: 80.0

    # 五邊進場飛行模式預設值
    pattern_altitude_m: 60.0       # 五邊飛行高度（AGL）
    downwind_offset_m: 150.0
    pattern_leg_length_m: 250.0
    final_approach_dist_m: 300.0

  # 衝浪者固定翼無人機（Surfer FW UAV）
  surfer:
    name: "衝浪者 (Surfer)"
    type: "fixed_wing"
    manufacturer: "Custom"

    mass_kg: 3.2
    max_payload_kg: 1.0
    wingspan_m: 1.8

    # 速度範圍
    stall_speed_mps: 11.0          # 失速速度（最低飛行速度）
    cruise_speed_mps: 18.0         # 巡航速度
    max_speed_mps: 28.0            # 最大速度

    # 續航力
    max_flight_time_min: 90
    max_range_km: 40

    # 飛行限制
    max_altitude_m: 2000
    service_ceiling_m: 3000
    max_wind_speed_mps: 12.0

    # 轉彎性能（關鍵參數）
    min_turn_radius_m: 30.0        # 最小轉彎半徑（@cruise speed, max bank）
    max_bank_angle_deg: 45.0       # 最大傾斜角（機體結構限制）
    recommended_turn_radius_m: 50.0  # 建議轉彎半徑（留餘量）

    # 起飛性能
    takeoff_distance_m: 50         # 起飛跑道距離（公尺）
    takeoff_climb_angle_deg: 15.0  # 起飛爬升角度（度）
    min_takeoff_speed_mps: 13.0    # 最小起飛速度

    # 降落性能
    landing_distance_m: 60         # 降落滑跑距離（公尺）
    approach_speed_mps: 14.0       # 進場速度
    glide_slope_deg: 5.0           # 下滑坡度（度）

    # 相機配置
    camera:
      sensor_width_mm: 13.2
      sensor_height_mm: 8.8
      image_width_px: 4000
      image_height_px: 3000
      focal_length_mm: 8.0
      gimbal_pitch_min_deg: -90
      gimbal_pitch_max_deg: 0

    # 任務參數
    waypoint_radius_m: 30.0        # 到達半徑（固定翼需較大）
    loiter_radius_m: 80.0          # 盤旋半徑
    rtl_altitude_m: 120.0          # 返航高度

    # 五邊進場飛行模式預設值
    pattern_altitude_m: 80.0       # 五邊飛行高度（AGL）
    downwind_offset_m: 200.0       # 下風邊側偏距離（公尺）
    pattern_leg_length_m: 300.0    # 標準腿長（公尺）
    final_approach_dist_m: 400.0   # 最終進場起始距離（公尺）

  generic_fixed_wing:
    name: "Generic Fixed Wing"
    type: "fixed_wing"
    manufacturer: "Generic"

    mass_kg: 2.5
    max_payload_kg: 1.0
    wingspan_m: 2.0

    # 速度範圍
    stall_speed_mps: 12.0
    cruise_speed_mps: 18.0
    max_speed_mps: 25.0

    # 續航力
    max_flight_time_min: 120
    max_range_km: 50

    # 飛行限制
    max_altitude_m: 3000
    service_ceiling_m: 4000
    max_wind_speed_mps: 15.0

    # 轉彎性能
    min_turn_radius_m: 50.0
    max_bank_angle_deg: 45
    recommended_turn_radius_m: 80.0

    # 起降
    takeoff_distance_m: 30
    landing_distance_m: 40

    waypoint_radius_m: 20.0
    loiter_radius_m: 100.0
    rtl_altitude_m: 100.0

# ==========================================
# 垂直起降固定翼（VTOL）配置（預留）
# ==========================================
vtol:
  generic_vtol:
    name: "Generic VTOL"
    type: "vtol"
    manufacturer: "Generic"
    
    mass_kg: 3.0
    max_payload_kg: 1.5
    
    # 多旋翼模式
    multirotor_mode:
      max_speed_mps: 10.0
      cruise_speed_mps: 5.0
      max_flight_time_min: 30
    
    # 固定翼模式
    fixed_wing_mode:
      cruise_speed_mps: 20.0
      max_speed_mps: 30.0
      max_flight_time_min: 90
    
    # 轉換時間
    transition_time_s: 5.0
    
    max_altitude_m: 3000
    service_ceiling_m: 4000
    
    waypoint_radius_m: 10.0
    loiter_radius_m: 50.0
    rtl_altitude_m: 80.0

  # ★ Pioneer PNP（开拓者，Pioneer V1.0）—— 動力系統規格
  #   ⚠ 規劃用數值（速度、轉彎半徑、起降高度、質量、航程）一律以 core/base/airframe.py 的
  #     PIONEER_PNP 為準，這裡不重抄（同 hero_pnp）。
  #   動力規格來源：使用者 2026-11-04 貼的廠商規格圖與台架測試表（升力 6518 KV200、前推 6525 KV180）。
  #   ⚠ 測試表是廠商台架數據（44.4 V 定電壓、0 空速靜態），不是這架實機的量測。
  #     兩張表頭都寫「電流 (V)」是筆誤，數值是安培（電壓×電流＝功率欄，逐列核對過）。
  #   同一份資料也寫在 vio_ate_studio 的 pid_advisor/aircraft/pioneer.yaml（lift_motor／forward_motor）。
  pioneer_pnp:
    name: "Pioneer PNP（开拓者）"
    type: "vtol"
    manufacturer: "MFE"
    rotor_count: 4                 # QuadPlane 4+1：Quad X 升力 ×4（SERVO9–12）＋前推 ×1（SERVO3＝70），依原廠參數

    powertrain:
      battery_cells: 12            # 12S，台架測試電壓 44.4 V
      lift_motor:
        count: 4
        model: "6518 KV200"        # 規格圖寫法；手冊寫 M6518 KV200
        kv: 200
        slot_pole: "24N28P"
        size_mm: "72.8×42.4"       # 規格圖原文
        mass_g: 423
        rated_voltage: "12S (44.4 V)"
        no_load_current_a: 2.4     # @20 V
        phase_resistance_mohm: 24  # 相間內阻
        max_current_a: 87
        rated_power_w: 1200
        max_thrust_g: 14700
        max_torque_nm: 3.74
        esc_recommended_a: 100
        propeller_recommended: "2278 碳纖槳"
        stator: "進口材料／表面防鏽處理"
        magnet_wire_rating: "耐 180°C"
        magnet_rating: "耐 180°C"
        centrifugal_cooling: true  # 離心散熱設計
        rotor_balance: "≤5 mg"
        coil_hipot: "500 V AC"     # 線圈耐壓測試
        ip_rating: "IP35"
        lead_length_mm: 100
        prop_mount_holes: "M4×16×4"
        motor_mount_holes: "M4×8×4"
        # 台架測試：碳纖維 2278 槳。手冊升力槳 22 吋與測試槳同徑；實裝槳型號未經使用者確認。
        bench_test:
          propeller: "碳纖維 2278"
          columns: [voltage_v, current_a, thrust_g, power_w, efficiency_g_per_w]
          rows:
            - [44.4,  2.4,  1025,  106.56, 9.62]
            - [44.4,  3.3,  1291,  146.52, 8.81]
            - [44.4,  4.5,  1610,  199.8,  8.06]
            - [44.4,  5.2,  1794,  230.88, 7.77]
            - [44.4,  6.8,  2219,  301.92, 7.35]
            - [44.4, 12.1,  3588,  537.24, 6.68]
            - [44.4, 14.6,  4225,  648.24, 6.52]
            - [44.4, 19.6,  5380,  870.24, 6.18]
            - [44.4, 23.2,  6105, 1030.08, 5.93]
            - [44.4, 28.0,  7050, 1243.2,  5.67]
            - [44.4, 32.7,  7755, 1451.88, 5.34]
            - [44.4, 38.9,  8763, 1727.16, 5.07]
            - [44.4, 46.6, 10250, 2069.04, 4.95]
            - [44.4, 52.1, 11175, 2313.24, 4.83]
            - [44.4, 62.9, 12512, 2792.76, 4.48]
            - [44.4, 75.7, 13748, 3361.08, 4.09]
            - [44.4, 87.4, 14737, 3880.56, 3.80]
      pusher_motor:
        count: 1
        model: "6525 KV180"        # 規格圖寫法；手冊寫 X6525 KV180
        kv: 180
        slot_pole: "24N28P"
        size_mm: "72.8×50.4"       # 規格圖原文
        mass_g: 563
        rated_voltage: "12S (44.4 V)"
        no_load_current_a: 1.3     # @20 V
        phase_resistance_mohm: 18.4  # 相間內阻
        max_current_a: 85
        rated_power_w: 1500
        max_thrust_g: 11900
        max_torque_nm: 3.9
        esc_recommended: "12S 120 A"
        propeller_recommended: "2113E"
        stator: "特殊表面防鏽處理"
        magnet_wire_rating: "耐 210°C"
        magnet_rating: "耐 210°C"
        centrifugal_cooling: true  # 離心散熱設計
        rotor_balance: "≤5 mg"
        coil_hipot: "500 V AC"     # 線圈耐壓測試
        ip_rating: "IP35"
        lead_length_mm: 100
        prop_mount_holes: "M4×8×4"
        motor_mount_holes: "M4×8×4"
        # 台架測試：2113E 槳。手冊前推槳 21 吋與測試槳同徑；實裝槳型號未經使用者確認。
        # ⚠ 靜態推力表（0 空速）不能直接換算巡航功率：同樣推力在 21.5 m/s 前進時耗電高得多。
        bench_test:
          propeller: "2113E"
          columns: [voltage_v, current_a, thrust_g, power_w, efficiency_g_per_w]
          rows:
            - [44.4,  2.6,  1175,  115.44, 10.18]
            - [44.4,  3.5,  1505,  155.4,   9.68]
            - [44.4,  5.5,  2101,  244.2,   8.60]
            - [44.4,  6.3,  2320,  279.72,  8.29]
            - [44.4,  8.2,  2805,  364.08,  7.70]
            - [44.4, 10.1,  3257,  448.44,  7.26]
            - [44.4, 12.9,  3898,  572.76,  6.81]
            - [44.4, 15.4,  4515,  683.76,  6.60]
            - [44.4, 18.6,  5225,  825.84,  6.33]
            - [44.4, 27.9,  6675, 1238.76,  5.39]
            - [44.4, 37.9,  8030, 1682.76,  4.77]
            - [44.4, 44.4,  8845, 1971.36,  4.49]
            - [44.4, 50.5,  9713, 2242.2,   4.33]
            - [44.4, 63.4, 10910, 2814.96,  3.88]
            - [44.4, 69.5, 11544, 3085.8,   3.74]
            - [44.4, 75.7, 11748, 3361.08,  3.50]
            - [44.4, 85.7, 11952, 3805.08,  3.14]

  # ★ HERO PNP（逆行者，Hero V4.0）—— 動力系統規格
  #   ⚠ 規劃用數值（速度、轉彎半徑、起降高度、質量、航程）一律以 core/base/airframe.py 的
  #     HERO_PNP 為準，這裡不重抄，避免兩份分叉（docs/hv_dccpp/AEROPLAN_接入手冊.md §10.2）。
  #   動力規格來源：使用者 2026-11-04 貼的廠商規格圖與台架測試表（升力 M4112 KV460、後推 X3520 KV500）。
  #   ⚠ 測試表是廠商台架數據（22.2 V 定電壓、0 空速靜態），不是這架實機的量測。
  #   同一份資料也寫在 vio_ate_studio 的 pid_advisor/aircraft/hero.yaml（lift_motor／forward_motor）。
  hero_pnp:
    name: "HERO PNP（逆行者）"
    type: "vtol"
    manufacturer: "MFE"
    rotor_count: 4                 # QuadPlane 4+1：Quad X 升力 ×4（SERVO9–12）＋後推 ×1（SERVO3＝70）

    powertrain:
      battery_cells: 6             # 6S，台架測試電壓 22.2 V
      lift_motor:
        count: 4
        model: "M4112 KV460"
        kv: 460
        slot_pole: "12N14P"
        size_mm: "49.8×27"         # 規格圖原文
        mass_g: 177
        rated_voltage: "6S (22.2 V)"
        no_load_current_a: 1.1     # @20 V
        phase_resistance_mohm: 113 # 相間內阻
        max_current_a: 39
        rated_power_w: 350
        max_thrust_g: 4100
        max_torque_nm: 1.2
        esc_recommended_a: 50
        propeller_recommended: "1550 碳纖槳"
        stator: "進口材料／表面防鏽處理"
        magnet_wire_rating: "耐 180°C"
        magnet_rating: "耐 180°C"
        centrifugal_cooling: true  # 離心散熱設計
        rotor_balance: "≤5 mg"
        coil_hipot: "500 V AC"     # 線圈耐壓測試
        ip_rating: "IP35"
        lead_length_mm: 100
        prop_mount_holes: "M3 Ø12×4 / M3 Ø15×4"
        motor_mount_holes: "M3 Ø30×4"
        # 台架測試：碳纖維 1550 槳（＝實裝升力槳，使用者 2026-10-27 確認 1550 全碳纖 15 吋）
        bench_test:
          propeller: "碳纖維 1550"
          columns: [voltage_v, current_a, thrust_g, power_w, efficiency_g_per_w]
          rows:
            - [22.2,  0.8,  294,  17.76, 16.55]
            - [22.2,  1.4,  442,  31.08, 14.22]
            - [22.2,  2.5,  675,  55.5,  12.16]
