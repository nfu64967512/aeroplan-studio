[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hv_dccpp"
version = "0.1.0"
description = "Heterogeneous-VTOL Dynamic Complete Coverage Path Planning (Pioneer PNP + HERO PNP) based on Wang et al. 2025"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "shapely>=2.0", "matplotlib>=3.8"]

[project.optional-dependencies]
mavlink = ["pymavlink>=2.4"]
mqtt = ["paho-mqtt>=1.6"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["hv_dccpp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
