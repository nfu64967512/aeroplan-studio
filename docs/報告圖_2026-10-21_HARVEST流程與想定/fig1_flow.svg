可多區）與起降場</text><rect x="44.0" y="124.0" width="8.0" height="8.0" rx="1" fill="#0E6378"/><text x="62.0" y="134.0" fill="#18222D" font-size="13.5">機隊：Pioneer（A）×1、HERO（B）×2</text><rect x="44.0" y="154.0" width="8.0" height="8.0" rx="1" fill="#0E6378"/><text x="62.0" y="164.0" fill="#18222D" font-size="13.5">相機足跡：視角、重疊率、目標 GSD → 航高</text><rect x="44.0" y="184.0" width="8.0" height="8.0" rx="1" fill="#0E6378"/><text x="62.0" y="194.0" fill="#18222D" font-size="13.5">空域：AGL 上限 120 m、最低定翼作業高度</text><rect x="44.0" y="214.0" width="8.0" height="8.0" rx="1" fill="#0E6378"/><text x="62.0" y="224.0" fill="#18222D" font-size="13.5">規劃風：手填／CWA 測站／Open-Meteo 網格</text><rect x="44.0" y="244.0" width="8.0" height="8.0" rx="1" fill="#0E6378"/><text x="62.0" y="254.0" fill="#18222D" font-size="13.5">地形：DEM 檔或 Cesium World Terrain</text><rect x="44.0" y="274.0" width="8.0" height="8.0" rx="1" fill="#0E6378"/><text x="62.0" y="284.0" fill="#18222D" font-size="13.5">禁航區、威脅區（Fence 管理）</text><rect x="44.0" y="304.0" width="8.0" height="8.0" rx="1" fill="none" stroke="#8794A0" stroke-width="1.2"/><text x="62.0" y="314.0" fill="#52606D" font-size="12">選用：航測建圖（真相機、交叉航帶、GCP）</text><rect x="444.0" y="20.0" width="392.0" height="330.0" rx="10" fill="#FFFFFF" stroke="#C3CCD4" stroke-width="1.3"/><circle cx="472.0" cy="50.0" r="14" fill="#18222D"/><text x="472.0" y="55.0" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="14">2</text><text x="496.0" y="56.0" fill="#18222D" font-weight="700" font-size="16.5">協調前處理</text><text x="820.0" y="55.0" text-anchor="end" fill="#52606D" font-size="11.5">SwarmCoordinator＋轉接層</text><line x1="460.0" y1="74.0" x2="820.0" y2="74.0" stroke="#C3CCD4" stroke-width="1"/><rect x="464.0" y="94.0" width="8.0" height="8.0" rx="1" fill="#0E6378"/><text x="482.0" y="104.0" fill="#18222D" font-size="13.5">機隊切區：1 塊作業區切成 n 塊子區</text><text x="482.0" y="130.0" fill="#52606D" font-size="12">混編機隊配單一大區會排不出工作</text><rect x="464.0" y="146.0" width="8.0" height="8.0" rx